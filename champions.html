<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iron Crown Combat — Hall of Champions</title>
  <style>
    :root{
      --bg: #0a0a0f;
      --muted: #aeb5cc;
      --text: #eaf0ff;
      --accent: #ff6a00;
      --accent-2:#ffb86b;
      --shadow: 0 10px 30px rgba(0,0,0,.45);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%;height:auto}

    .container{max-width:900px;margin:auto;padding:24px}
    header.page{margin-bottom:20px}
    header.page h1{font-size:clamp(1.6rem,3vw,2.2rem);margin:0}
    header.page small{color:var(--muted)}

    /* Champion card */
    .champion-card{
      position:relative;
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      background:#12121a;
      padding:16px;
      text-align:center;
    }
    .champion-card img{
      max-width:100%;
      height:auto;
      display:block;
      margin:0 auto;
      border-radius:var(--radius);
    }
    .belt-badge{
      position:absolute; top:16px; left:16px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#181818; font-weight:800;
      border-radius:999px; padding:8px 14px; box-shadow:var(--shadow);
    }
    .overlay{
      margin-top:12px;
    }
    .overlay .name{font-weight:900;font-size:1.5rem}
    .overlay .meta{color:var(--muted);font-size:.95rem;margin-top:4px}
  </style>
</head>
<body>
  <div class="container">
    <header class="page">
      <h1>Hall of Champions</h1>
      <small>Current ICC Title Holder</small>
    </header>

    <!-- Current Champion -->
    <section class="champion-card" aria-label="Current Champion">
      <span class="belt-badge">KING OF THE CROWN</span>
      <img src="assets/images/fighters/champion/maddox-champion-card.png" alt="Cole Maddox — Current Champion" />
      <div class="overlay">
        <div class="name"><a href="fighters.html#cole-maddox">Cole Maddox</a></div>
        <div class="meta">Reign began Jun 15, 2025</div>
      </div>
    </section>
  </div>
</body>
</html>
