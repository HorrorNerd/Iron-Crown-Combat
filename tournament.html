<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iron Crown Combat - The Iron Trial</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root { --c-gold: #ffd700; --c-red: #cc0000; --c-dark-bg: #111; --c-card-bg: #1a1a1a; --c-grey-text: #ccc; }
    body { margin: 0; font-family: 'Oswald', 'Impact', Arial, sans-serif; background-color: #000; color: #f5f5f5; line-height: 1.6;}
    header { background-color: var(--c-dark-bg); padding: 1em 0 0.7em; border-bottom: 3px solid var(--c-gold); text-align: center;}
    .logo { color: var(--c-gold); font-size: 2.2em; font-weight: bold; margin: 0; letter-spacing: 1px;}
    nav { margin-top: 1em; display: flex; justify-content: center; flex-wrap: wrap; gap: 0.6em;}
    nav a { background-color: #1c1c1c; border: 1px solid #333; padding: 8px 16px; border-radius: 6px; color: var(--c-red); text-decoration: none; font-size: 1.1em; font-weight: bold; letter-spacing: 1.2px; transition: background 0.2s, color 0.2s;}
    nav a.active, nav a:hover { background: var(--c-gold); color: #181a1b; border-color: #e56915;}
    main { padding: 2em 1em;}
    .archive-section { text-align: center; margin-bottom: 2em; padding-bottom: 2em; border-bottom: 2px solid #333;}
    .archive-section label { font-size: 1.2em; color: var(--c-grey-text); margin-right: 1em;}
    .archive-dropdown { background-color: var(--c-card-bg); color: #fff; border: 1px solid var(--c-gold); padding: 10px; font-size: 1.1em; border-radius: 5px;}
    .tournament-title { text-align: center; color: var(--c-gold); font-size: 2.5em; margin-bottom: 1.2em; letter-spacing: 2px;}
    .bracket { display: flex; flex-wrap: wrap; justify-content: space-between; max-width: 1400px; margin: 0 auto;}
    .round { min-width: 210px; flex: 1 0 200px; display: flex; flex-direction: column; justify-content: space-around;}
    .round h3 { text-align: center; color: var(--c-grey-text); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1em;}
    .matchup { position: relative; margin-bottom: 2em;}
    .fighter { display: flex; align-items: center; background-color: var(--c-card-bg); padding: 0.5em; border-radius: 6px; margin: 0.5em 0; border: 2px solid #333; transition: border 0.2s, box-shadow 0.2s;}
    .fighter img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background-color: #23272a; margin-right: 1em; border: 2.5px solid #181a1b;}
    .fighter-name { font-weight: bold; font-size: 1.1em; letter-spacing: 0.8px;}
    .winner { border-color: var(--c-gold); box-shadow: 0 0 10px var(--c-gold); background: linear-gradient(93deg,#23272a 56%,#ffd70024 120%);}
    .winner .fighter-name { color: var(--c-gold);}
    .tbd .fighter-name { color: var(--c-grey-text); font-style: italic;}
    @media (max-width: 1100px) { .bracket { max-width: 98vw; gap: 0.5em;} .round{min-width:0;}}
    @media (max-width: 900px) { .bracket { flex-direction: column; align-items: center;} .round { width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; margin-bottom: 2em;} .round h3 { width: 100%; margin-bottom: 1em;} .matchup { width: 45%; margin: 1em 2.5%;}}
    @media (max-width: 600px) { .matchup { width: 93%; } .tournament-title { font-size: 1.3em; }}
  </style>
</head>
<body>
  <header>
    <h1 class="logo">IRON <span style="color:#e56915;">CROWN</span> COMBAT</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="fighters.html">Fighters</a>
      <a href="events.html">Events</a>
      <a href="rankings.html">Rankings</a>
      <a href="news.html">News</a>
      <a href="tournament.html" class="active">Tournament</a>
      <a href="about.html">About</a>
      <a href="rules.html">Test Your Metal</a>
    </nav>
  </header>
  <main>
    <div class="archive-section">
      <label for="archive-select">View Past Tournaments:</label>
      <select id="archive-select" class="archive-dropdown" onchange="if (this.value) window.location.href=this.value;">
        <option value="">Select an Archive...</option>
        <option value="crucible-champ-tournament-archive.html">Crucible Championship</option>
        <!-- Add future tournament archives here -->
      </select>
    </div>
    <h2 class="tournament-title">The Iron Trial – Tournament Bracket</h2>
    <div class="bracket" id="bracket-container"></div>
  </main>
  <footer class="footer" style="margin-top:2em; text-align:center;">
    &copy; 2025 Iron Crown Combat. All rights reserved.
  </footer>
  <script>
    // List all fighters, add img links as desired
    const fighters = {
      "Abigail Jones": { name: "Abigail Jones", img: "" },
      "Franco Candellini": { name: "Franco Candellini", img: "" },
      "Sophia Rodriques": { name: "Sophia Rodriques", img: "" },
      "Rocky Brickston": { name: "Rocky Brickston", img: "" },
      "Kumari Twins": { name: "Kumari Twins", img: "" },
      "Wade Sansom": { name: "Wade Sansom", img: "" },
      "Reiko Draven": { name: "Reiko Draven", img: "" },
      "Patricia Mavis Stokes": { name: "Patricia Mavis Stokes", img: "" },
      "Malik Carter": { name: "Malik Carter", img: "" },
      "Tina Wilder": { name: "Tina Wilder", img: "" },
      "Kai Lawson": { name: "Kai Lawson", img: "" },
      "Natsume Tokonuto": { name: "Natsume Tokonuto", img: "" },
      "Igor": { name: "Igor", img: "" },
      "Pao Chaiya": { name: "Pao Chaiya", img: "" },
      "Marcus Graves": { name: "Marcus Graves", img: "" },
      "Piak Chaiya": { name: "Piak Chaiya", img: "" },
      "Eli Blackfox": { name: "Eli Blackfox", img: "" },
      "S’ri Prai-Chaiya": { name: "S’ri Prai-Chaiya", img: "" },
      "The Executioner": { name: "The Executioner", img: "" },
      "Fernando Riveiro": { name: "Fernando Riveiro", img: "" },
      "Master Bo Qin": { name: "Master Bo Qin", img: "" },
      "Brielle Fontaine": { name: "Brielle Fontaine", img: "" },
      "Veronica Kane": { name: "Veronica Kane", img: "" },
      "Rich Action": { name: "Rich Action", img: "" },
      "Gabriel Azrael": { name: "Gabriel Azrael", img: "" }
    };

    // Iron Trial: Round 1 matchups
    const tournament = {
      round1: [
        { p1: "Abigail Jones", p2: "Franco Candellini", winner: null },
        { p1: "Sophia Rodriques", p2: "Rocky Brickston", winner: null },
        { p1: "Kumari Twins", p2: "Wade Sansom", winner: null },
        { p1: "Reiko Draven", p2: "Patricia Mavis Stokes", winner: null },
        { p1: "Malik Carter", p2: "Tina Wilder", winner: null },
        { p1: "Kai Lawson", p2: "Natsume Tokonuto", winner: null },
        { p1: "Igor", p2: "Pao Chaiya", winner: null },
        { p1: "Marcus Graves", p2: "Piak Chaiya", winner: null },
        { p1: "Eli Blackfox", p2: "S’ri Prai-Chaiya", winner: null },
        { p1: "The Executioner", p2: "Fernando Riveiro", winner: null },
        { p1: "Master Bo Qin", p2: "Brielle Fontaine", winner: null },
        { p1: "Veronica Kane", p2: "Tina Wilder", winner: null },
        { p1: "Rich Action", p2: "Gabriel Azrael", winner: null }
      ]
      // Add Round 2, etc., as the tournament advances
    };

    const TBD_FIGHTER = { name: "TBD", img: "" };

    function createFighterHTML(fighter, isWinner) {
      const winnerClass = isWinner ? "winner" : "";
      const tbdClass = !fighter.name || fighter.name === 'TBD' ? "tbd" : "";
      const imgSrc = fighter.img || 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
      return `<div class="fighter ${winnerClass} ${tbdClass}"><img src="${imgSrc}" alt="${fighter.name}"><span class="fighter-name">${fighter.name}</span></div>`;
    }

    function buildBracket() {
      const container = document.getElementById('bracket-container');
      container.innerHTML = '';

      // Round 1 display
      const r1Div = document.createElement('div');
      r1Div.className = 'round';
      r1Div.innerHTML = `<h3>Round 1</h3>`;
      tournament.round1.forEach(match => {
        const matchDiv = document.createElement('div');
        matchDiv.className = 'matchup';
        matchDiv.innerHTML = `
          ${createFighterHTML(fighters[match.p1] || { name: match.p1, img: "" }, match.winner === match.p1)}
          ${createFighterHTML(fighters[match.p2] || { name: match.p2, img: "" }, match.winner === match.p2)}
        `;
        r1Div.appendChild(matchDiv);
      });
      container.appendChild(r1Div);

      // You can programmatically add more rounds here as your tournament advances!
    }

    buildBracket();
  </script>
</body>
</html>
