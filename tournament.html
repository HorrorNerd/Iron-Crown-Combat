<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iron Crown Combat - Tournament Bracket</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #111; color: #f1f1f1; font-family:'Oswald','Impact',Arial,sans-serif; margin:0; }
    header { background: #181a1b; text-align:center; padding:1.4em 0 1em 0; border-bottom:3px solid #ffd700;}
    .logo { font-size:2.1em;color:#ffd700; font-weight: bold;text-shadow: 0 2px 10px #23272a;}
    nav { margin:1em 0 1.6em 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.8em;}
    nav a { background:#23272a; color:#ffd700; text-decoration:none; padding:0.5em 1.1em; border-radius:7px; font-weight:bold; font-size:1em;border:1.5px solid #e56915; transition:.15s;}
    nav a.active,nav a:hover { background:#ffd700; color:#23272a }
    main { padding:2em 1em; max-width:1100px; margin:auto;}
    .tournament-controls { text-align:center; margin-bottom:1.5em; color:#ffd700; }
    .bracket { margin-bottom: 3em;}
    .round { margin: 2.5em 0; background:rgba(30,32,33,0.85); border-radius:13px; box-shadow:0 2px 18px #181a1b33;padding:2em 1em;}
    .round h3 { color:#ffd700; text-align:center;text-transform:uppercase; font-size:1.21em; margin-bottom:1.5em;}
    .matchup { display:flex;justify-content:space-around;align-items:center; margin-bottom:1.6em;}
    .fight-column { flex: 1 1 0; display: flex; flex-direction:column; gap:0.5em;}
    .fighter { display: flex; align-items: center;gap:0.7em; background:#16191c; border-radius:8px; padding: 0.4em 1.1em 0.4em 0.4em; border: 2px solid #282828;}
    .fighter img { width:38px; height:38px; object-fit:cover; border-radius:50%;border:2.5px solid #ffd70044;background:#23272a;}
    .fighter-name { font-weight: bold; font-size:1.09em; letter-spacing: .8px;}
    .winner { border-color: #ffd700; background:linear-gradient(90deg,#23272a,#ffd70028);}
    .winner .fighter-name { color:#ffd700;}
    .tbd .fighter-name {color:#aaa; font-style:italic;}
    .match-info { min-width:110px; text-align:center; font-size:.94em; color:#feb636;}
    .match-info strong { color:#ffd700;}
    @media(max-width:700px){.matchup{flex-direction:column;}
      .match-info {margin:0.65em 0;}}
  </style>
</head>
<body>
  <header>
    <h1 class="logo">IRON <span style="color:#e56915;">CROWN</span> COMBAT</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="fighters.html">Fighters</a>
      <a href="events.html">Events</a>
      <a href="rankings.html">Rankings</a>
      <a href="news.html">News</a>
      <a href="tournament.html" class="active">Tournament</a>
      <a href="about.html">About</a>
      <a href="rules.html">Test Your Metal</a>
    </nav>
  </header>
  <main>
    <div class="tournament-controls" id="bracket-controls"></div>
    <div class="bracket" id="bracket-container"></div>
    <div style="color:#ffd700;text-align:center;margin-top:2em;">Edit the <b>Winner</b> field in your Google Sheet to update results live.</div>
  </main>
  <footer style="margin-top:2em; text-align:center;">
    &copy; 2025 Iron Crown Combat. All rights reserved.
  </footer>
  <script>
    // Your Google Sheet info
    const sheetID = "1l8KRwK2D3Uyc6WTqqc6KO95nBqtfJ2WAnQSu6zyFicU";
    const fightersSheet = "Fighter Tracker";
    const eventsSheet = "Event";
    const fightersURL = `https://opensheet.elk.sh/${sheetID}/${encodeURIComponent(fightersSheet)}`;
    const eventsURL = `https://opensheet.elk.sh/${sheetID}/${encodeURIComponent(eventsSheet)}`;

    // Change this to your tournament name to display
    const DEFAULT_TOURNAMENT = "Iron Trial";

    async function getFightersDict() {
      const res = await fetch(fightersURL);
      const data = await res.json();
      const dict = {};
      data.forEach(row => {
        if (row.Fighter)
          dict[row.Fighter.trim()] = {
            name: row.Fighter.trim(),
            img: row.Image ? row.Image.trim() : ''
          };
      });
      return dict;
    }

    // Fetch all unique tournaments for selector
    async function getTournamentsList() {
      const res = await fetch(eventsURL);
      const data = await res.json();
      const set = new Set();
      data.forEach(row => {
        if(row.Tournament && row.Tournament.trim())
          set.add(row.Tournament.trim());
      });
      return Array.from(set);
    }

    // Fetch and group by Event name for a given tournament
    async function getRoundsForTournament(tournamentName) {
      const res = await fetch(eventsURL);
      const rows = await res.json();
      // Only matches for the active tournament
      const filtered = rows.filter(row => 
        row.Tournament && row.Tournament.trim() === tournamentName
      );
      // Group by Event name (i.e., 'Iron Trial Round 1 (date)')
      const byEvent = {};
      filtered.forEach(row => {
        const round = row.Event || "Unknown Round";
        if (!byEvent[round]) byEvent[round] = [];
        byEvent[round].push(row);
      });
      // Ordered by appearance (sheet order)
      const ordered = Object.keys(byEvent).map(eventName => ({
        round: eventName,
        matches: byEvent[eventName]
      }));
      return ordered;
    }

    // Format a fighter display (portrait, highlight if winner)
    function createFighterHTML(fighter, isWinner) {
      const winnerClass = isWinner ? "winner" : "";
      const tbdClass = !fighter.name || fighter.name === 'TBD' ? "tbd" : "";
      const imgSrc = fighter.img || 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
      return `<div class="fighter ${winnerClass} ${tbdClass}"><img src="${imgSrc}" alt="${fighter.name}"><span class="fighter-name">${fighter.name||"TBD"}</span></div>`;
    }

    // Main display logic
    async function displayTournamentBracket(tournament=DEFAULT_TOURNAMENT) {
      // Fighters image dict
      const fighters = await getFightersDict();
      // Bracket matchups by round 
      const rounds = await getRoundsForTournament(tournament);
      const container = document.getElementById('bracket-container');
      container.innerHTML = '';
      rounds.forEach((roundObj, rIdx) => {
        const rdiv = document.createElement('div');
        rdiv.className = 'round';
        let [title, ...dateRest] = roundObj.round.split(/[(-]/);
        title = title.trim();
        const dateLabel = dateRest.length ? `<span style="font-size:.89em; color:#feb636;">(${dateRest.join('-').replace(')','').trim()})</span>` : "";
        rdiv.innerHTML = `<h3>${title} ${dateLabel}</h3>`;
        roundObj.matches.forEach(match => {
          const f1 = fighters[match["Fighter A"]] || { name: match["Fighter A"], img: "" };
          const f2 = fighters[match["Fighter B"]] || { name: match["Fighter B"], img: "" };
          const winner = match.Winner && match.Winner.trim();
          const isDraw = (winner && winner.toLowerCase() === "draw");
          const matchupDiv = document.createElement('div');
          matchupDiv.className = 'matchup';
          matchupDiv.innerHTML = `
            <div class="fight-column">
              ${createFighterHTML(f1, (!isDraw && winner === f1.name))}
              <div class="match-info">${match["Match Rating"] ? `<strong>★ ${match["Match Rating"]}</strong>`:""}</div>
            </div>
            <div class="fight-column">
              ${createFighterHTML(f2, (!isDraw && winner === f2.name))}
              <div class="match-info">${match["bonus type"]?`${match["bonus type"]}`:""}${match["Title Fight"]?"<div>🏆 Title Fight</div>":""}</div>
            </div>
          `;
          if (isDraw) {
            matchupDiv.innerHTML += `<div class="match-info" style="color:#fe5a40; font-weight:bold;">DRAW</div>`;
          }
          rdiv.appendChild(matchupDiv);
        });
        container.appendChild(rdiv);
      });
      // Show selector with current
      showTournamentSelector(tournament);
    }

    // Tournament dropdown controls  
    async function showTournamentSelector(current) {
      const allTournaments = await getTournamentsList();
      const controls = document.getElementById('bracket-controls');
      if (allTournaments.length <= 1) {
        controls.innerHTML = `<h2>Tournament: <span style="color:#ffd700;">${current}</span></h2>`;
        return;
      }
      let html = `<label for="tournsel" style="margin-right:1em; font-size:1.15em;">Tournament:</label>
      <select id="tournsel" style="font-size:1.11em; padding:0.3em 1.2em;border-radius:7px;background:#16191c;color:#ffd700;border:1.3px solid #ffd700;">`;

      allTournaments.forEach(t =>
        html += `<option value="${t}"${t===current?' selected':''}>${t}</option>`
      );
      html += `</select>`;
      controls.innerHTML = html;
      document.getElementById('tournsel').onchange = e =>
        displayTournamentBracket(e.target.value);
    }

    // INIT
    displayTournamentBracket();
  </script>
</body>
</html>
