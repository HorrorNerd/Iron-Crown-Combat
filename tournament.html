<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iron Crown Combat — The Iron Trial</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    /* ===== Bracket Layout ===== */
    .toolbar { display:flex; gap:.6rem; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:1rem; }
    .toolbar .select { padding:.5rem .7rem; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); }

    .bracket-container { overflow-x: auto; padding-bottom: .5rem; }
    .bracket {
      --gap: 2.0rem;                /* horizontal gap between rounds */
      --v-gap: 1.2rem;              /* vertical gap between matches */
      --line: var(--border);
      --winner: var(--icc-gold, #c8a64d);
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: var(--gap);
      min-width: 880px;
    }
    .round { display: grid; align-content: start; gap: var(--v-gap); }
    .round h3 { margin: 0 0 .6rem 0; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); font-size: .95rem; }

    .match {
      position: relative;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .65rem .75rem;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
    }
    .match .name { font-weight: 600; }
    .match .sub { color: var(--muted); font-size: .9em; white-space: nowrap; }
    .match.winner {
      border-color: var(--winner);
      box-shadow: inset 3px 0 0 var(--winner);
      background: color-mix(in oklab, var(--winner) 8%, transparent);
    }

    .match::after { /* horizontal connector to the next round */
      content: "";
      position: absolute;
      right: -1rem; top: 50%;
      width: 1rem; height: 1px;
      background: var(--line);
    }
    .connector {
      position: relative;
      height: calc(100% + var(--v-gap));
      margin-top: calc(var(--v-gap) * -0.5);
      margin-bottom: calc(var(--v-gap) * -0.5);
    }
    .connector::before { /* vertical merge line */
      content: "";
      position: absolute;
      left: -1rem; top: 25%; bottom: 25%;
      width: 1px; background: var(--line);
    }
    .receives::before { /* incoming stub from left */
      content: "";
      position: absolute;
      left: -1rem; top: 50%;
      width: 1rem; height: 1px;
      background: var(--line);
    }

    .round-col { min-width: 260px; }

    @media (max-width: 900px){
      .bracket { display: block; min-width: 0; }
      .round-col { margin-bottom: 1.25rem; }
      .match::after, .connector::before, .receives::before { display: none; } /* hide lines on stacked view */
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav" data-nav>
      <a class="logo" href="index.html" aria-label="Iron Crown Combat home">
        <img src="assets/img/favicon.png" alt="ICC" width="28" height="28" style="border-radius:6px;border:1px solid var(--border)" />
        <span>Iron Crown Combat</span>
      </a>
      <nav class="menu" aria-label="Primary">
        <a href="events.html">Events</a>
        <a href="rankings.html">Rankings</a>
        <a href="fighters.html">Fighters</a>
        <a href="gyms.html">Gyms</a>
        <a href="news.html">News</a>
        <a href="rules.html">Rules</a>
        <a href="tournament.html" aria-current="page">Tournaments</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="pagehead">
      <h1>The Iron Trial</h1>
      <p class="meta">Switch tournaments to view past brackets.</p>
    </div>

    <div class="toolbar">
      <div class="card" style="padding:.6rem .75rem">Tournament:
        <select id="t-select" class="select" aria-label="Choose tournament"></select>
      </div>
      <div class="meta">Tip: You can link directly, e.g. <code>?t=iron-trial</code></div>
    </div>

    <section class="card">
      <div id="bracketHost">
        <div class="bracket-container"><div class="bracket">Loading…</div></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container cols">
      <small>© <span id="yr"></span> Iron Crown Combat · A TNGaming production</small>
    </div>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    // --------- Simple tournament loader (JSON) ----------
    // Files:
    //  - assets/data/tournaments.json                -> [{slug, name, year}]
    //  - assets/data/tournaments/<slug>.json         -> { name, rounds: [ {name, matches:[{a,b,winner}]} ] }
    //
    // Example file contents provided below this page code.

    const $ = s => document.querySelector(s);
    const params = new URLSearchParams(location.search);
    const STORAGE_KEY = 'icc:lastTournament';

    const FALLBACK = {
      name: "The Iron Trial",
      rounds: [
        { name: "Quarterfinals", matches: [
          { a:"Abigail Jones", b:"Hotarubi Kendo", winner:"a" },
          { a:"Rich Action", b:"Dante Marcheli", winner:"a" },
          { a:"Sophia Rodriques", b:"Fernando Riveiro", winner:"a" },
          { a:"Kumari Twins", b:"Augg Action", winner:"b" },
        ]},
        { name: "Semifinals", matches: [
          { a:"Abigail Jones", b:"Rich Action", winner:"a" },
          { a:"Sophia Rodriques", b:"Augg Action", winner:null }, // pending
        ]},
        { name: "Final", matches: [
          { a:"Abigail Jones", b:"Winner of Sophia Rodriques / Augg Action", winner:null }
        ]}
      ]
    };

    async function fetchJson(url){
      const res = await fetch(url, { cache:'no-store' });
      if (!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    }

    function matchEl({a,b,winner}) {
      const aWin = winner === 'a';
      const bWin = winner === 'b';
      return `
        <div class="match ${aWin ? 'winner':''}">
          <span class="name">${a}</span>
        </div>
        <div class="match ${bWin ? 'winner':''}">
          <span class="name">${b}</span>
        </div>
      `;
    }

    function roundEl({name, matches}, idx, total) {
      // add connector blocks between paired matches to draw vertical merge lines
      let html = `<div class="round-col"><div class="round"><h3>${name}</h3>`;
      for (let i=0;i<matches.length;i++){
        const m = matches[i];
        const isOdd = i % 2 === 1;
        // Receiver markers (for rounds after the first) so lines look right
        const receivesAttr = idx>0 ? 'receives' : '';
        html += `
          <div class="match ${m.winner==='a'?'winner':''} ${receivesAttr ? 'receives':''}">
            <span class="name">${m.a}</span>
          </div>
          <div class="connector"></div>
          <div class="match ${m.winner==='b'?'winner':''}">
            <span class="name">${m.b}</span>
          </div>
        `;
        // Add extra spacing between pairs so connectors line up nicely
        if (isOdd && i < matches.length-1) html += `<div style="height: var(--v-gap);"></div>`;
      }
      html += `</div></div>`;
      return html;
    }

    function renderBracket(tournament){
      const host = document.querySelector('#bracketHost .bracket');
      if (!host) return;
      host.innerHTML = tournament.rounds.map((r, i) => roundEl(r, i, tournament.rounds.length)).join('');
      document.title = `Iron Crown Combat — ${tournament.name}`;
      document.querySelector('.pagehead h1').textContent = tournament.name;
    }

    async function loadTournament(slug){
      // remember last
      localStorage.setItem(STORAGE_KEY, slug);
      const url = `assets/data/tournaments/${slug}.json`;
      try {
        const data = await fetchJson(url);
        renderBracket(data);
      } catch (e) {
        console.warn('Falling back to embedded data:', e);
        renderBracket(FALLBACK);
      }
    }

    async function boot(){
      // load tournament list
      let list = [];
      try {
        list = await fetchJson('assets/data/tournaments.json');
      } catch(e) {
        // If list fails, synthesize a one-item list for Iron Trial
        list = [{ slug:'iron-trial', name:'The Iron Trial', year:new Date().getFullYear() }];
      }

      const select = document.getElementById('t-select');
      select.innerHTML = list.map(t => `<option value="${t.slug}">${t.name}${t.year ? ' ('+t.year+')':''}</option>`).join('');

      const urlSlug = (new URLSearchParams(location.search)).get('t');
      const saved = localStorage.getItem(STORAGE_KEY);
      const slug = urlSlug || saved || (list[0] && list[0].slug) || 'iron-trial';

      select.value = slug;
      await loadTournament(slug);

      select.addEventListener('change', () => {
        const s = select.value;
        const p = new URLSearchParams(location.search);
        p.set('t', s);
        history.replaceState(null, '', location.pathname + '?' + p.toString());
        loadTournament(s);
      });
    }

    boot();
  </script>
</body>
</html>
