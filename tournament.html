<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>The Iron Trial – Tournament Bracket</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-bracket/0.11.1/jquery.bracket.min.css"/>
  <style>
    body { background: #181a1b; color: #fff; font-family: 'Oswald', Arial, sans-serif; margin:0; }
    .tournament-title { color: #ffd700; font-size:2.1em; text-align:center; margin:1.2em 0 2em 0;}
    #bracket { display:flex; justify-content:center; margin-bottom:3em;}
    .team-img { vertical-align:middle; width:32px; height:32px; border-radius:50%; object-fit:cover; background:#23272a; margin-right:0.7em;}
    .jqbracket .highlightWinner { background: #ffd70055 !important; color: #23272a !important;}
  </style>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-bracket/0.11.1/jquery.bracket.min.js"></script>
</head>
<body>
  <h2 class="tournament-title">The Iron Trial – Tournament Bracket</h2>
  <div id="bracket"></div>
  <div style="color:#ffd700;text-align:center">Edit your sheet and refresh for live updates.<br/>Want automatic refresh? Ask for a polling script.</div>
  <script>
    // ---- CONFIG ----
    const SHEET_ID = "1l8KRwK2D3Uyc6WTqqc6KO95nBqtfJ2WAnQSu6zyFicU";
    const FIGHTER_TAB = "Fighter Tracker";
    const EVENT_TAB = "Event";
    const TOURNAMENT = "Iron Trial";
    const fightersURL = `https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(FIGHTER_TAB)}`;
    const eventsURL = `https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(EVENT_TAB)}`;

    // ---- FETCH FIGHTER IMAGES AND NAMES ----
    async function getFighterImages() {
      const res = await fetch(fightersURL);
      const rows = await res.json();
      const dict = {};
      rows.forEach(r => {
        if (r.Fighter)
          dict[r.Fighter.trim()] = r.Image ? r.Image.trim() : "";
      });
      return dict;
    }

    // ---- PULL MATCHES FOR GIVEN TOURNAMENT ----
    async function getBracketMatches() {
      const res = await fetch(eventsURL);
      const matches = [];
      const winners = {};
      const rows = await res.json();
      // Only grabs matches for the Iron Trial tournament and sorts round/event order
      rows.filter(r => r.Tournament && r.Tournament.trim() === TOURNAMENT)
        .forEach(r => {
          const round = r.Event || "Round";
          matches.push({
            round,
            p1: r["Fighter A"] ? r["Fighter A"].trim() : "",
            p2: r["Fighter B"] ? r["Fighter B"].trim() : "",
            winner: r["Winner"] ? r["Winner"].trim() : null
          });
        });
      return matches;
    }

    // ---- BUILD BRACKET DATA FOR LIBRARY ----
    function buildBracketData(matches) {
      // Group by rounds (event label)
      const roundLabels = [];
      const rounds = [];
      let matchByRound = {};

      matches.forEach(m => {
        if (!matchByRound[m.round]) {
          roundLabels.push(m.round);
          matchByRound[m.round] = [];
        }
        matchByRound[m.round].push([m.p1, m.p2, m.winner]);
      });

      // First round = teams
      const teams = matchByRound[roundLabels[0]].map(pair => [pair[0], pair[1]]);
      // Now convert results to required format: [ [p1 result, p2 result, ...], [next round ...], ... ]
      const results = [];
      for (let r = 0; r < roundLabels.length; r++) {
        const row = [];
        matchByRound[roundLabels[r]].forEach(([p1,p2,winner]) => {
          if (!winner) row.push(null);
          else if (winner === p1) row.push(1);
          else if (winner === p2) row.push(0);
          else row.push(null); // handle draws/nulls
        });
        results.push(row);
      }
      return { teams, results, roundLabels };
    }

    // ---- RENDER BRACKET ----
    async function renderBracket() {
      const [images, rawMatches] = await Promise.all([getFighterImages(), getBracketMatches()]);
      if (!rawMatches.length) {
        $('#bracket').html('<div style="color:#f55;font-size:1.2em;padding:2em;text-align:center;">No tournament matches found in your sheet for '+TOURNAMENT+'.</div>');
        return;
      }
      const bracketData = buildBracketData(rawMatches);
      // Advanced: inject custom team label renderer (with images)
      $('#bracket').empty().bracket({
        init: { teams: bracketData.teams, results: bracketData.results },
        teamLabel: function(teamData) {
          if (teamData && teamData.name) {
            const url = images[teamData.name] || '';
            return (url ? `<img class="team-img" src="${url}"/>` : '') + teamData.name;
          }
          return '';
        }
      });
    }

    renderBracket();
  </script>
</body>
</html>
