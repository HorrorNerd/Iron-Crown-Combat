<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iron Crown Combat — Tournament</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    /* Toolbar & basic layout */
    .toolbar { display:flex; gap:.6rem; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:1rem; }
    .toolbar .select { padding:.5rem .7rem; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); }

    /* Bracket layout */
    .bracket-container { overflow-x: auto; padding-bottom: .5rem; }
    .bracket {
      /* sizing tokens */
      --gap: 2rem;
      --v-gap: 14px;
      --match-h: 56px;
      --line: var(--border);
      --winner: var(--icc-gold, #c8a64d);

      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: var(--gap);
      min-width: 880px;

      /* computed from JS: --qf-rows -> --qf-height */
      --qf-rows: 8; /* default; will be overwritten by JS */
      --qf-height: calc(var(--qf-rows) * var(--match-h) + (var(--qf-rows) - 1) * var(--v-gap));
    }

    .round-col {
      /* This centers later rounds vertically to match QF column height */
      min-height: var(--qf-height);
      display: flex;
      align-items: center; /* vertical centering */
    }

    .round { display: grid; align-content: start; gap: var(--v-gap); width: 100%; }
    .round h3 { margin: 0 0 .6rem 0; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); font-size: .95rem; }

    /* Match card */
    .match {
      position: relative;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .5rem .6rem;
      min-height: var(--match-h);
      display: grid;
      grid-template-columns: 40px 1fr auto;
      gap: .55rem;
      align-items: center;
    }
    .match img.thumb {
      width: 40px; height: 40px; border-radius: 8px; object-fit: cover;
      border: 1px solid var(--border); background: var(--bg-2); display: block;
    }
    .noimg img.thumb { display:none; }

    .name { font-weight: 600; line-height: 1.15; position: relative; padding-right: 2.4rem; }
    .name .name-wrap { display:flex; align-items:flex-start; gap:.35rem; }
    .fighter-name { display:inline-block; }
    .seed-badge {
      position: absolute; top: 0; right: 0;
      font-size: .72em; font-weight: 700; color: var(--muted);
      padding: .1rem .35rem; border: 1px solid var(--border);
      border-radius: 6px; background: var(--bg-2); line-height: 1;
    }
    .sub { color: var(--muted); font-size: .85em; }

    .match.winner {
      border-color: var(--winner);
      box-shadow: inset 3px 0 0 var(--winner);
      background: color-mix(in oklab, var(--winner) 8%, transparent);
    }

    /* Connectors (desktop) */
    .match::after {
      content: "";
      position: absolute;
      right: -1rem; top: 50%;
      width: 1rem; height: 1px; background: var(--line);
    }
    .connector {
      position: relative; height: calc(100% + var(--v-gap));
      margin-top: calc(var(--v-gap) * -0.5);
      margin-bottom: calc(var(--v-gap) * -0.5);
    }
    .connector::before { content: ""; position: absolute; left: -1rem; top: 25%; bottom: 25%; width: 1px; background: var(--line); }
    .receives::before { content: ""; position: absolute; left: -1rem; top: 50%; width: 1rem; height: 1px; background: var(--line); }

    .badge-crown {
      display:inline-flex; align-items:center; gap:.35rem;
      border:1px solid var(--winner); color: var(--winner);
      padding:.25rem .5rem; border-radius: 999px; font-size: .8em; font-weight: 600;
      background: color-mix(in oklab, var(--winner) 12%, transparent);
    }

    /* Responsive: simplify connections, stack columns */
    @media (max-width: 900px){
      .bracket { display: block; min-width: 0; }
      .round-col { min-height: 0; margin-bottom: 1.25rem; }
      .match::after, .connector::before, .receives::before { display: none; }
    }
  </style>
</head>
<body>

  <!-- Shared navbar placeholder; populated by navbar.html -->
  <div id="navbar"></div>

  <main class="container">
    <div class="pagehead">
      <h1>The Iron Trial</h1>
      <p class="meta">Switch tournaments to view past brackets.</p>
    </div>

    <div class="toolbar">
      <div class="card" style="padding:.6rem .75rem">Tournament:
        <select id="t-select" class="select" aria-label="Choose tournament"></select>
      </div>
      <div class="meta">Tip: link directly with <code>?t=iron-trial</code></div>
    </div>

    <section class="card">
      <div class="bracket-container">
        <div class="bracket" id="bracket"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container cols">
      <small>© <span id="yr"></span> Iron Crown Combat · A TNGaming production</small>
    </div>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    const LIST_URL = 'assets/data/tournaments.json';
    const DEFAULT_TOURNAMENTS = [
      { slug:'iron-trial', name:'The Iron Trial', year:2025, published:true },
      { slug:'king-of-the-crown', name:'King of the Crown', year:2024 },
      { slug:'queen-of-the-crown', name:'Queen of the Crown', year:2025, published:true }
    ];
    const DATA_URL = slug => `assets/data/tournaments/${slug}.json`;
    const FIGHTERS_URL = 'assets/fighters.json';
    const STORAGE_KEY = 'icc:lastTournament';

    const FALLBACK = {
      name: "The Iron Trial",
      rounds: [
        { name: "Quarterfinals", matches: [
        { a:"Abigail Jones", b:"Hotarubi Kendo", winner:"a" },
        { a:"Rich Action", b:"Dante Marcheli", winner:"a" },
        { a:"Sophia Rodriques", b:"Fernando Riveiro", winner:"a" },
        { a:"Kumari Twins", b:"Augg Action", winner:"b" }
      ]},
      { name: "Semifinals", matches: [
        { a:"Abigail Jones", b:"Rich Action", winner:"a" },
        { a:"Sophia Rodriques", b:"Augg Action", winner:"b" }
      ]},
      { name: "Final", matches: [
        { a:"Abigail Jones", b:"Augg Action", winner:"b" }
      ]}
    ]
    };

    const $ = s => document.querySelector(s);
    const slugify = s => String(s||'')
      .toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

    async function fetchJSON(url){
      const r = await fetch(url, {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }

    async function pickImage(pathBase){
      const tryExt = async ext => {
        try { const r = await fetch(`${pathBase}.${ext}`, {method:'HEAD'}); return r.ok ? `${pathBase}.${ext}` : null; }
        catch { return null; }
      };
      return (await tryExt('png')) || (await tryExt('jpg')) || (await tryExt('jpeg')) || (await tryExt('webp'));
    }

    async function resolveImg(name, fightersMap){
      if (!name || /winner of/i.test(name)) return null;

      // small normalization to handle "The <name>"
      const raw = String(name).trim();
      const noThe = raw.replace(/^the\s+/i, '');
      for (const key of [raw, noThe]){
        const entry = fightersMap && fightersMap[key];
        if (entry && entry.img) return entry.img;
      }

      // Fallback to slug in assets/images/fighters/
      const base = `assets/images/fighters/${slugify(raw)}`;
      return await pickImage(base);
    }

    function championFromRounds(tourney){
      const last = tourney.rounds[tourney.rounds.length-1];
      if (!last || !last.matches || !last.matches[0]) return null;
      const fm = last.matches[0];
      if (fm.winner === 'a') return fm.a;
      if (fm.winner === 'b') return fm.b;
      return null;
    }

    function parseSeededName(name){
      const raw = String(name || '').trim();
      const m = raw.match(/^#?\s*(\d+)\s+(.*)$/);
      if (m) return { seed: `#${m[1]}`, display: m[2] };
      return { seed: null, display: raw };
    }

    function matchHTML({name, isWinner, isA, imgUrl, isChampion}){
      const noImg = imgUrl ? '' : 'noimg';
      const crown = isChampion ? `<span class="badge-crown">👑 Champion</span>` : '';
      const { seed, display } = parseSeededName(name);
      const seedHTML = seed ? `<span class="seed-badge">${seed}</span>` : '';
      return `
        <div class="match ${isWinner ? 'winner':''} ${noImg} ${isA ? 'receives':''}">
          <img class="thumb" src="${imgUrl || ''}" alt="" onerror="this.closest('.match').classList.add('noimg')" />
          <span class="name">
            <span class="name-wrap">
              <span class="fighter-name">${display}</span>
              ${seedHTML}
            </span>
          </span>
          ${crown}
        </div>
      `;
    }

    function roundColHTML(round, idx, total, imgMap, champion){
      let html = `<div class="round-col"><div class="round"><h3>${round.name}</h3>`;
      for (let i=0;i<round.matches.length;i++){
        const m = round.matches[i];
        const aWin = m.winner === 'a';
        const bWin = m.winner === 'b';
        const aChamp = champion && m.a === champion && aWin && idx === total-1;
        const bChamp = champion && m.b === champion && bWin && idx === total-1;

        html += matchHTML({ name:m.a, isWinner:aWin, isA:true,  imgUrl: imgMap.get(m.a) || null, isChampion:aChamp });
        html += `<div class="connector"></div>`;
        html += matchHTML({ name:m.b, isWinner:bWin, isA:false, imgUrl: imgMap.get(m.b) || null, isChampion:bChamp });

        if (i % 2 === 1 && i < round.matches.length-1) html += `<div style="height: var(--v-gap);"></div>`;
      }
      html += `</div></div>`;
      return html;
    }

    async function renderBracket(tourney, fightersMap){
      const host = document.getElementById('bracket');
      host.innerHTML = 'Loading…';

      /* Compute QF rows for vertical centering = number of fighter slots in round 1 */
      const r1 = tourney.rounds[0];
      const qfRows = r1 && r1.matches ? r1.matches.length * 2 : 8;
      host.style.setProperty('--qf-rows', qfRows);

      /* Pre-resolve images */
      const names = new Set();
      tourney.rounds.forEach(r => r.matches.forEach(m => { names.add(m.a); names.add(m.b); }));

      const imgMap = new Map();
      for (const n of names){
        const url = await resolveImg(n, fightersMap);
        imgMap.set(n, url);
      }

      const champion = championFromRounds(tourney);
      host.innerHTML = tourney.rounds.map((r,i)=>
        roundColHTML(r, i, tourney.rounds.length, imgMap, champion)
      ).join('');

      document.title = `Iron Crown Combat — ${tourney.name}`;
      document.querySelector('.pagehead h1').textContent = tourney.name;
    }

    async function loadTournament(slug, fightersMap){
      localStorage.setItem(STORAGE_KEY, slug);
      try {
        const tourney = await fetchJSON(DATA_URL(slug));
        await renderBracket(tourney, fightersMap);
      } catch {
        await renderBracket(FALLBACK, fightersMap);
      }
    }

    async function boot(){
      // Load shared fighters map
      let fightersMap = {};
      try { fightersMap = await fetchJSON(FIGHTERS_URL); } catch { fightersMap = {}; }
      if (fightersMap.fighters) fightersMap = fightersMap.fighters; // unwrap if nested

      // Load tournament list
      let list;
      try {
        const loaded = await fetchJSON(LIST_URL);
        list = Array.isArray(loaded) ? loaded : DEFAULT_TOURNAMENTS;
      } catch {
        list = DEFAULT_TOURNAMENTS;
      }

      const sel = document.getElementById('t-select');
      sel.innerHTML = list.map(t => `<option value="${t.slug}">${t.name}${t.year ? ' ('+t.year+')':''}</option>`).join('');

      const urlSlug = (new URLSearchParams(location.search)).get('t');
      const saved = localStorage.getItem(STORAGE_KEY);
      const slug = urlSlug || saved || (list[0] && list[0].slug) || 'iron-trial';
      sel.value = slug;

      await loadTournament(slug, fightersMap);

      sel.addEventListener('change', () => {
        const s = sel.value;
        const p = new URLSearchParams(location.search);
        p.set('t', s);
        history.replaceState(null, '', location.pathname + '?' + p.toString());
        loadTournament(s, fightersMap);
      });
    }

    boot();
  </script>

  <!-- Load shared navbar (absolute path so it works everywhere) -->
  <script>
    fetch("/Iron-Crown-Combat/navbar.html")
      .then(r => r.text())
      .then(html => {
        const mount = document.getElementById("navbar");
        if (mount) mount.innerHTML = html;

        // Mobile menu toggle
        const btn = document.getElementById("menuBtn");
        const menu = document.getElementById("primaryMenu");
        if (btn && menu){
          btn.addEventListener("click", () => {
            const open = menu.classList.toggle("open");
            btn.setAttribute("aria-expanded", open ? "true" : "false");
          });
        }

        // Auto-highlight current page
        const path = location.pathname;
        document.querySelectorAll("#primaryMenu a.item").forEach(a => {
          try {
            const hrefPath = new URL(a.href, location.origin).pathname;
            if (hrefPath === path) a.classList.add("active");
          } catch(e){}
        });
      });
  </script>
</body>
</html>
