<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Iron Crown Combat - Tournament</title>
    <style>
        :root { --c-gold: #ffd700; --c-red: #cc0000; --c-dark-bg: #111; --c-card-bg: #1a1a1a; --c-grey-text: #ccc; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #000; color: #f5f5f5; line-height: 1.6; }
        header { background-color: var(--c-dark-bg); padding: 1em; border-bottom: 3px solid var(--c-gold); text-align: center; }
        .logo { color: var(--c-gold); font-size: 2.2em; font-weight: bold; margin: 0; letter-spacing: 1px; }
        nav { margin-top: 1em; display: flex; justify-content: center; flex-wrap: wrap; gap: 0.5em; }
        nav a { background-color: #1c1c1c; border: 1px solid #333; padding: 8px 16px; border-radius: 5px; color: var(--c-red); text-decoration: none; font-size: 1.1em; font-weight: bold; transition: background-color 0.2s, color 0.2s; }
        nav a:hover { background-color: var(--c-gold); color: #000; }
        main { padding: 2em 1em; }
        .tournament-title { text-align: center; color: var(--c-gold); font-size: 2.5em; margin-bottom: 1em; }
        .bracket { display: flex; justify-content: space-between; max-width: 1400px; margin: 0 auto; }
        .round { width: 22%; display: flex; flex-direction: column; justify-content: space-around; }
        .round h3 { text-align: center; color: var(--c-grey-text); text-transform: uppercase; letter-spacing: 2px; }
        .matchup { position: relative; margin-bottom: 2em; }
        .match-connector { display: flex; align-items: center; justify-content: flex-end; }
        .connector-line { width: 100%; height: 2px; background: var(--c-gold); opacity: 0.5; }
        .connector-path { position: absolute; right: -16%; top: 50%; width: 16%; height: 50%; border: 2px solid var(--c-gold); border-left: none; opacity: 0.5;}
        .matchup:nth-of-type(odd) .connector-path { border-top-right-radius: 10px; border-bottom: none; }
        .matchup:nth-of-type(even) .connector-path { border-bottom-right-radius: 10px; border-top: none; top: 0; }
        .round-final .connector-path { display: none; }
        .fighter { display: flex; align-items: center; background-color: var(--c-card-bg); padding: 0.5em; border-radius: 5px; margin: 0.5em 0; border: 2px solid #333; }
        .fighter img { width: 50px; height: 50px; border-radius: 50%; object-fit: contain; background-color: #222; margin-right: 1em; }
        .fighter-name { font-weight: bold; font-size: 1.1em; }
        .winner { border-color: var(--c-gold); box-shadow: 0 0 10px var(--c-gold); }
        .winner .fighter-name { color: var(--c-gold); }
        .tbd .fighter-name { color: var(--c-grey-text); font-style: italic; }
        @media (max-width: 900px) {
            .bracket { flex-direction: column; }
            .round { width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; margin-bottom: 2em; }
            .round h3 { width: 100%; margin-bottom: 1em; }
            .matchup { width: 45%; margin: 1em 2.5%; }
            .match-connector { display: none; }
        }
        @media (max-width: 600px) { .matchup { width: 90%; } }
    </style>
</head>
<body>
    <header>
        <h1 class="logo">Iron Crown Combat</h1>
        <nav> <a href="index.html">Home</a> <a href="fighters.html">Fighters</a> <a href="events.html">Events</a> <a href="rankings.html">Rankings</a> <a href="news.html">News</a> <a href="tournament.html">Tournament</a> <a href="about.html">About</a> <a href="rules.html">Test Your Metal</a> </nav>
    </header>
    <main>
        <h2 class="tournament-title">Crucible Tournament</h2>
        <div class="bracket" id="bracket-container"></div>
    </main>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
    
    // ####################################################################
    // #                  THE ONLY PLACE YOU NEED TO EDIT                   #
    // ####################################################################

    // Define all fighters with their data once.
    const fighters = {
        "Shiv":             { name: "Shiv", img: "https://i.postimg.cc/bNCHpPDL/Shiv.png" },
        "Cole Maddox":      { name: "Cole Maddox", img: "https://i.postimg.cc/mDH6FDMb/Maddox.png" },
        "Abigail Jones":    { name: "Abigail Jones", img: "https://i.postimg.cc/fW5YfsKZ/Abigail-Jones.png" },
        "Sophia Rodriques": { name: "Sophia Rodriques", img: "https://i.postimg.cc/NFNTs8ML/Sophia-Rodriques.png" },
        "Dante Marcheli":   { name: "Dante Marcheli", img: "https://i.postimg.cc/yNXD6hpB/Dante-Marcheli.png" },
        "Veronica Kane":    { name: "Veronica Kane", img: "https://i.postimg.cc/Wbb6Bz3h/Veronica-Kane.png" },
        "The Kumari Twins": { name: "The Kumari Twins", img: "https://i.postimg.cc/pdySRkL5/Kumari-Twins.png" },
        "Kai Lawson":       { name: "Kai Lawson", img: "https://i.postimg.cc/43MSdtYL/KAI-LAWSON.png" }
    };

    // Define the tournament structure and update winners here.
    // To set a winner, replace null with the fighter's name in quotes.
    const tournament = {
        round1: [
            { p1: "Shiv", p2: "Cole Maddox", winner: "Cole Maddox" },
            { p1: "Abigail Jones", p2: "Sophia Rodriques", winner: "Sophia Rodriques" },
            { p1: "Dante Marcheli", p2: "Veronica Kane", winner: "Dante Marcheli" },
            { p1: "The Kumari Twins", p2: "Kai Lawson", winner: "The Kumari Twins" }
        ],
        round2: [
            { p1: "Cole Maddox", p2: "Sophia Rodriques", winner: "Cole Maddox" }, // Winner of match 1 vs winner of match 2
            { p1: "Dante Marcheli", p2: "The Kumari Twins",winner: "The Kumari Twins }  // Winner of match 3 vs winner of match 4
        ],
        round3: [
            { p1: "Cole Maddox", p2: "The Kumari Twins",winner: null } // Winner of semi-final 1 vs winner of semi-final 2
        ]
    };

    // ####################################################################
    // #                    NO EDITS NEEDED BELOW THIS LINE                 #
    // ####################################################################

    const TBD_FIGHTER = { name: "TBD", img: "" };

    const createFighterHTML = (fighter, isWinner) => {
        const winnerClass = isWinner ? 'winner' : '';
        const tbdClass = fighter.name === 'TBD' ? 'tbd' : '';
        const imgSrc = fighter.img || 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
        return `<div class="fighter ${winnerClass} ${tbdClass}"><img src="${imgSrc}" alt="${fighter.name}"><span class="fighter-name">${fighter.name}</span></div>`;
    };
    
    const buildBracket = () => {
        const container = document.getElementById('bracket-container');
        container.innerHTML = '';
        const roundTitles = ["Round 1", "Semi-Finals", "Finals", "Champion"];

        // --- ROUND 1 ---
        const r1Div = document.createElement('div');
        r1Div.className = 'round';
        r1Div.innerHTML = `<h3>${roundTitles[0]}</h3>`;
        tournament.round1.forEach(match => {
            const matchDiv = document.createElement('div');
            matchDiv.className = 'matchup';
            matchDiv.innerHTML = `
                ${createFighterHTML(fighters[match.p1], match.winner === match.p1)}
                ${createFighterHTML(fighters[match.p2], match.winner === match.p2)}
                <div class="match-connector"><div class="connector-line"></div><div class="connector-path"></div></div>
            `;
            r1Div.appendChild(matchDiv);
        });
        container.appendChild(r1Div);

        // --- ROUND 2 ---
        const r2Div = document.createElement('div');
        r2Div.className = 'round';
        r2Div.innerHTML = `<h3>${roundTitles[1]}</h3>`;
        const r2_match1_p1 = tournament.round1[0].winner ? fighters[tournament.round1[0].winner] : TBD_FIGHTER;
        const r2_match1_p2 = tournament.round1[1].winner ? fighters[tournament.round1[1].winner] : TBD_FIGHTER;
        const r2_match2_p1 = tournament.round1[2].winner ? fighters[tournament.round1[2].winner] : TBD_FIGHTER;
        const r2_match2_p2 = tournament.round1[3].winner ? fighters[tournament.round1[3].winner] : TBD_FIGHTER;
        const r2_match1_winner = tournament.round2[0].winner;
        const r2_match2_winner = tournament.round2[1].winner;
        r2Div.innerHTML += `<div class="matchup">
            ${createFighterHTML(r2_match1_p1, r2_match1_winner === r2_match1_p1.name)}
            ${createFighterHTML(r2_match1_p2, r2_match1_winner === r2_match1_p2.name)}
            <div class="match-connector"><div class="connector-line"></div><div class="connector-path"></div></div>
        </div>`;
        r2Div.innerHTML += `<div class="matchup">
            ${createFighterHTML(r2_match2_p1, r2_match2_winner === r2_match2_p1.name)}
            ${createFighterHTML(r2_match2_p2, r2_match2_winner === r2_match2_p2.name)}
            <div class="match-connector"><div class="connector-line"></div><div class="connector-path"></div></div>
        </div>`;
        container.appendChild(r2Div);

        // --- ROUND 3 ---
        const r3Div = document.createElement('div');
        r3Div.className = 'round';
        r3Div.innerHTML = `<h3>${roundTitles[2]}</h3>`;
        const r3_match1_p1 = r2_match1_winner ? fighters[r2_match1_winner] : TBD_FIGHTER;
        const r3_match1_p2 = r2_match2_winner ? fighters[r2_match2_winner] : TBD_FIGHTER;
        const r3_match1_winner = tournament.round3[0].winner;
        r3Div.innerHTML += `<div class="matchup">
            ${createFighterHTML(r3_match1_p1, r3_match1_winner === r3_match1_p1.name)}
            ${createFighterHTML(r3_match1_p2, r3_match1_winner === r3_match1_p2.name)}
        </div>`;
        container.appendChild(r3Div);
        
        // --- CHAMPION ---
        const champDiv = document.createElement('div');
        champDiv.className = 'round round-final';
        champDiv.innerHTML = `<h3>${roundTitles[3]}</h3>`;
        const champion = r3_match1_winner ? fighters[r3_match1_winner] : TBD_FIGHTER;
        champDiv.innerHTML += `<div class="matchup"><div class="fighter winner">${createFighterHTML(champion, true)}</div></div>`;
        container.appendChild(champDiv);
    };
    buildBracket();
});
</script>
</body>
</html>
