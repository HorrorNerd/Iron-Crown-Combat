<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iron Crown Combat — Rankings</title>

  <meta name="description" content="Iron Crown Combat fighter rankings: earnings leaders and most wins." />
  <meta property="og:title" content="Iron Crown Combat — Rankings" />
  <meta property="og:description" content="Earnings leaders and most wins." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/img/og-cover.png" />
  <meta name="theme-color" content="#0f1115" />

  <link rel="icon" href="assets/img/favicon.png" />
  <link rel="preload" href="assets/css/main.css" as="style" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>

  <!-- Shared navbar placeholder; populated by navbar.html -->
  <div id="navbar"></div>

  <section id="champion-box" class="container" style="margin-bottom:1rem;">
    <div class="card">Loading champion…</div>
  </section>

  <div class="grid grid-2">
    <section class="card">
      <h3>Most Money Earned</h3>
      <table class="table">
        <thead><tr><th>#</th><th>Fighter</th><th>Gym</th><th>Earnings</th></tr></thead>
        <tbody id="earnings-body"><tr><td colspan="4">Loading…</td></tr></tbody>
      </table>
    </section>

    <section class="card">
      <h3>Most Wins</h3>
      <table class="table">
        <thead><tr><th>#</th><th>Fighter</th><th>Gym</th><th>Wins</th></tr></thead>
        <tbody id="wins-body"><tr><td colspan="4">Loading…</td></tr></tbody>
      </table>
    </section>
  </div>

  <footer class="footer">
    <div class="container cols">
      <small>© <span id="yr"></span> Iron Crown Combat · A TNGaming production</small>
      <div style="display:flex;gap:.6rem">
        <a class="chip" href="https://youtube.com/@SwtTNGaming" target="_blank" rel="noopener">YouTube</a>
        <a class="chip" href="https://www.twitch.tv/" target="_blank" rel="noopener">Twitch</a>
        <a class="chip" href="https://beacons.ai/tngamingyt" target="_blank" rel="noopener">Links</a>
      </div>
    </div>
  </footer>

  <!-- Your existing logic (if any) -->
  <script src="assets/js/main.js" defer></script>
  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
  </script>

  <!-- Load shared navbar (absolute path so it works everywhere) -->
  <script>
    fetch("/Iron-Crown-Combat/navbar.html")
      .then(r => r.text())
      .then(html => {
        const mount = document.getElementById("navbar");
        if (mount) mount.innerHTML = html;

        // Mobile menu toggle
        const btn = document.getElementById("menuBtn");
        const menu = document.getElementById("primaryMenu");
        if (btn && menu){
          btn.addEventListener("click", () => {
            const open = menu.classList.toggle("open");
            btn.setAttribute("aria-expanded", open ? "true" : "false");
          });
        }

        // Auto-highlight current page
        const path = location.pathname;
        document.querySelectorAll("#primaryMenu a.item").forEach(a => {
          try {
            const hrefPath = new URL(a.href, location.origin).pathname;
            if (hrefPath === path) a.classList.add("active");
          } catch(e){}
        });
      });
  </script>
</body>
</html>
