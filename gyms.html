<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iron Crown Combat — Gyms</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    .gym-header { display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
    .gym-header:hover { color: var(--icc-gold); }
    .roster { margin-top:.6rem; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav" data-nav>
      <a class="logo" href="index.html" aria-label="Iron Crown Combat home">
        <img src="assets/img/favicon.png" alt="ICC" width="28" height="28" style="border-radius:6px;border:1px solid var(--border)" />
        <span>Iron Crown Combat</span>
      </a>
      <nav class="menu" aria-label="Primary">
        <a href="events.html">Events</a>
        <a href="rankings.html">Rankings</a>
        <a href="fighters.html">Fighters</a>
        <a href="gyms.html" aria-current="page">Gyms</a>
        <a href="news.html">News</a>
        <a href="rules.html">Rules</a>
        <a href="tournament.html">Tournaments</a>
        <a href="about.html">About</a>
      </nav>
      <div class="actions" style="display:flex;gap:.5rem;align-items:center">
        <button class="btn" data-theme-toggle title="Toggle theme" aria-label="Toggle light/dark theme">🌓</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="pagehead"><h1>Gyms</h1></div>

    <section class="grid grid-2" id="gyms-grid">
      <div class="card">Loading gyms…</div>
    </section>
  </main>

  <footer class="footer">
    <div class="container cols">
      <small>© <span id="yr"></span> Iron Crown Combat · A TNGaming production</small>
    </div>
  </footer>

<script>
  // year + theme toggle
  document.getElementById('yr').textContent = new Date().getFullYear();
  (function(){ const root=document.documentElement; const saved=localStorage.getItem('icc:theme'); if(saved==='light') root.classList.add('light');
    document.addEventListener('click',e=>{ const t=e.target.closest('[data-theme-toggle]'); if(!t) return;
      root.classList.toggle('light'); localStorage.setItem('icc:theme', root.classList.contains('light')?'light':'dark'); }); })();

  (function(){
    const SHEET_ID='1l8KRwK2D3Uyc6WTqqc6KO95nBqtfJ2WAnQSu6zyFicU';
    const GID='1277877160'; // Fighter Tracker
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;

    const grid = document.getElementById('gyms-grid');

    // Helpers
    const normKey = s => String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
    const cleanGym = s => String(s||'').trim().replace(/\s+/g,' ');
    const isHeaderish = v => {
      const x = String(v||'').trim().toLowerCase();
      return x === 'fighter' || x === 'wins' || x === 'losses' || x === 'draws' || x === 'earnings' || x === 'gym' || x === 'win %' || x === 'win%';
    };
    const num$ = v => {
      if (v == null || v === '') return 0;
      // Prefer numeric if GViz gave it (e.g., 66900), else strip currency
      const n = Number(v);
      if (Number.isFinite(n)) return n;
      const m = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
      return Number.isFinite(m) ? m : 0;
    };
    const fmt$ = n => `$${Math.round(n).toLocaleString()}`;

    function parseGViz(text){
      const start=text.indexOf('{'), end=text.lastIndexOf('}');
      const json=JSON.parse(text.slice(start,end+1));
      const cols=json.table.cols;

      // Build label->index map (skip boolean/checkbox column "FALSE")
      const map = {};
      cols.forEach((c,i)=>{
        const label = (c && (c.label || c.id) || '').trim();
        if (!label) return;
        if (c && c.type === 'boolean') return; // skip TRUE/FALSE col 0
        map[label.toLowerCase()] = i;
      });

      // Hard-map by your exact headers
      const idx = {
        fighter: map['fighter'],
        wins:    map['wins'],
        losses:  map['losses'],
        draws:   map['draws'],
        earn:    map['earnings'],
        gym:     map['gym'],
      };

      // Fallbacks based on your known order if any are missing
      if (idx.fighter == null) idx.fighter = 1;
      if (idx.wins    == null) idx.wins    = 2;
      if (idx.losses  == null) idx.losses  = 3;
      if (idx.draws   == null) idx.draws   = 4;
      if (idx.earn    == null) idx.earn    = 7;
      if (idx.gym     == null) idx.gym     = 10;

      const get = (row, i) => {
        if (i == null || i < 0) return '';
        const c = row.c[i];
        if (!c) return '';
        // Use formatted if present, else raw
        return (c.f != null ? c.f : c.v) ?? '';
      };

      const out = [];
      for (const r of (json.table.rows || [])){
        const fighter = get(r, idx.fighter);
        const gymRaw  = get(r, idx.gym);
        const wins    = get(r, idx.wins);
        const losses  = get(r, idx.losses);
        const draws   = get(r, idx.draws);
        const earn    = get(r, idx.earn);

        // Drop obvious header/blank rows
        if (!fighter && !gymRaw) continue;
        if (isHeaderish(fighter) || isHeaderish(gymRaw)) continue;

        out.push({
          fighter: String(fighter).trim(),
          gym: cleanGym(gymRaw || 'Independent'),
          wins: String(wins || '0').trim(),
          losses: String(losses || '0').trim(),
          draws: String(draws || '0').trim(),
          earnings: earn
        });
      }
      return out;
    }

    function render(groups){
      const gyms = Object.keys(groups)
        .sort((a,b)=> groups[b].fighters.length - groups[a].fighters.length || a.localeCompare(b));

      grid.innerHTML = gyms.map(key=>{
        const g = groups[key];
        const total = g.fighters.reduce((s,f)=> s + num$(f.earnings), 0);

        const list = g.fighters.map(f=>{
          return `<li>${f.fighter} — ${f.wins}-${f.losses}-${f.draws} · ${fmt$(num$(f.earnings))}</li>`;
        }).join('');

        return `<article class="card">
          <div class="gym-header" data-acc>
            <div>
              <h3 style="margin:0">${g.displayName}</h3>
              <div class="meta" style="margin-top:.25rem">${fmt$(total)} total</div>
            </div>
            <span class="chip">${g.fighters.length} fighter${g.fighters.length===1?'':'s'}</span>
          </div>
          <div class="roster prose" hidden>
            <ul style="margin-left:1rem">${list}</ul>
          </div>
        </article>`;
      }).join('') || '<div class="card">No gyms found.</div>';
    }

    // Accordion
    document.addEventListener('click', (e)=>{
      const acc = e.target.closest('[data-acc]');
      if (!acc) return;
      const roster = acc.parentElement.querySelector('.roster');
      roster.hidden = !roster.hidden;
    });

    async function boot(){
      try{
        const res=await fetch(url,{cache:'no-store'});
        const text=await res.text();
        const rows=parseGViz(text);

        // Group by normalized gym key, keep first display name
        const groups = {};
        for (const r of rows){
          const key = normKey(r.gym || 'Independent');
          if (!groups[key]) groups[key] = { displayName: r.gym || 'Independent', fighters: [] };
          groups[key].fighters.push(r);
        }

        render(groups);
      }catch(e){
        grid.innerHTML = '<div class="card">Failed to load gyms.</div>';
        console.error('gyms parse error', e);
      }
    }
    boot();
  })();
</script>




</body>
</html>
