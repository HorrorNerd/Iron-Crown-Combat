<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iron Crown Combat — Gyms</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    .gym-header { display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
    .gym-header:hover { color: var(--icc-gold); }
    .roster { margin-top:.6rem; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav" data-nav>
      <a class="logo" href="index.html" aria-label="Iron Crown Combat home">
        <img src="assets/img/favicon.png" alt="ICC" width="28" height="28" style="border-radius:6px;border:1px solid var(--border)" />
        <span>Iron Crown Combat</span>
      </a>
      <nav class="menu" aria-label="Primary">
        <a href="events.html">Events</a>
        <a href="rankings.html">Rankings</a>
        <a href="fighters.html">Fighters</a>
        <a href="gyms.html" aria-current="page">Gyms</a>
        <a href="news.html">News</a>
        <a href="rules.html">Rules</a>
        <a href="tournament.html">Tournaments</a>
        <a href="about.html">About</a>
      </nav>
      <div class="actions" style="display:flex;gap:.5rem;align-items:center">
        <button class="btn" data-theme-toggle title="Toggle theme" aria-label="Toggle light/dark theme">🌓</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="pagehead"><h1>Gyms</h1></div>

    <section class="grid grid-2" id="gyms-grid">
      <div class="card">Loading gyms…</div>
    </section>
  </main>

  <footer class="footer">
    <div class="container cols">
      <small>© <span id="yr"></span> Iron Crown Combat · A TNGaming production</small>
    </div>
  </footer>

  <script>
  // year + theme toggle
  document.getElementById('yr').textContent = new Date().getFullYear();
  (function(){ const root=document.documentElement; const saved=localStorage.getItem('icc:theme'); if(saved==='light') root.classList.add('light');
    document.addEventListener('click',e=>{ const t=e.target.closest('[data-theme-toggle]'); if(!t) return;
      root.classList.toggle('light'); localStorage.setItem('icc:theme', root.classList.contains('light')?'light':'dark'); }); })();

  (function(){
    const SHEET_ID='1l8KRwK2D3Uyc6WTqqc6KO95nBqtfJ2WAnQSu6zyFicU';
    const GID='1277877160'; // Fighter Tracker
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;

    const grid = document.getElementById('gyms-grid');

    const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'').trim();
    const getVal = (row, idx) => {
      const c = row.c[idx];
      if (!c) return '';
      const v = (c.f != null ? c.f : c.v);
      return (v == null) ? '' : String(v);
    };

    function parseGViz(text){
      const start=text.indexOf('{'), end=text.lastIndexOf('}');
      const json=JSON.parse(text.slice(start,end+1));
      const cols=json.table.cols.map(c=>c.label || c.id || '');
      const mapIdx={}; cols.forEach((lab,i)=>{ mapIdx[norm(lab)||`col${i}`]=i; });

      const pick = (row, names, fallback='')=>{
        for (const n of names){
          const idx = mapIdx[norm(n)];
          if (idx != null){
            const val = getVal(row, idx);
            if (val !== '') return val;
          }
        }
        return fallback;
      };

      const rows=(json.table.rows||[]).map(r=>({
        fighter: pick(r, ['Fighter','Name','Fighter Name']),
        gym:     pick(r, ['Gym','Camp'], 'Independent'),
        wins:    pick(r, ['Wins','W'], '0'),
        losses:  pick(r, ['Losses','L'], '0'),
        earnings: pick(r, ['Earnings','Payout','$','Total Earned','Money'], ''),
      }));
      return rows;
    }

    function render(groups){
      const gyms = Object.keys(groups).sort((a,b)=> groups[b].length - groups[a].length);
      grid.innerHTML = gyms.map(gym=>{
        const list = groups[gym].map(r=>{
          const earnings = r.earnings ? ` · $${String(r.earnings).replace(/[^0-9.]/g,'')}` : '';
          return `<li>${r.fighter} — ${r.wins}-${r.losses}${earnings ? `<span class="meta">${earnings}</span>` : ''}</li>`;
        }).join('');
        return `<article class="card">
          <div class="gym-header" data-acc>
            <h3>${gym}</h3>
            <span class="chip">${groups[gym].length} fighter${groups[gym].length===1?'':'s'}</span>
          </div>
          <div class="roster prose" hidden>
            <ul style="margin-left:1rem">${list}</ul>
          </div>
        </article>`;
      }).join('') || '<div class="card">No gyms found.</div>';
    }

    document.addEventListener('click', (e)=>{
      const acc = e.target.closest('[data-acc]');
      if (!acc) return;
      const roster = acc.parentElement.querySelector('.roster');
      roster.hidden = !roster.hidden;
    });

    async function boot(){
      try{
        const res=await fetch(url,{cache:'no-store'});
        const text=await res.text();
        const rows=parseGViz(text);
        const groups={};
        for (const r of rows){
          (groups[r.gym] = groups[r.gym] || []).push(r);
        }
        render(groups);
      }catch(e){
        grid.innerHTML='<div class="card">Failed to load gyms.</div>';
        console.error('gyms parse error', e);
      }
    }
    boot();
  })();
</script>

</body>
</html>
