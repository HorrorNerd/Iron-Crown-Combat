<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iron Crown Combat - Gyms</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: url('image.png') no-repeat center/cover fixed; color: #f1f1f1; margin: 0; min-height: 100vh; font-family: 'Oswald','Impact',Arial,sans-serif; }
    header { text-align: center; background: rgba(35,39,42,.97); border-bottom: 3px solid #ffd700; padding: 2em 0 1em 0;}
    .logo { font-size: 2.2rem; color: #ffd700; text-shadow: 0 2px 10px #23272a; margin-bottom: 1em;}
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .7em; margin-bottom: 1.5em;}
    nav a { text-decoration: none; font-weight: bold; background: #181a1b; color: #ffd700; border: 1.5px solid #e56915; border-radius: 8px; padding: .7em 1.3em; letter-spacing: 2px; transition: background .18s, color .12s;}
    nav a.active, nav a:hover { background: #ffd700; color: #23272a;}
    main { max-width: 900px; margin: 3em auto 4em auto; padding: 0 1.5em;}
    .gyms-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:2em; margin-bottom:3em;}
    .gym-card { background: rgba(30,32,33,0.92); border-radius:22px; text-align:center; padding:1.5em 1em; cursor:pointer; border-left: 8px solid #e56915; transition: box-shadow .19s;}
    .gym-card:hover { box-shadow: 0 4px 24px #ffd70032, 0 3px 28px #e5691555 inset;}
    .gym-name { color: #ffd700; font-size:1.2em; font-weight:bold; margin-bottom:.7em; letter-spacing:2px;}
    .manager-name { color:#e56915; font-size:1.08em; font-weight:bold; margin-bottom:.6em;}
    .gym-modal { display:none; position:fixed; z-index:20; left:0; top:0; width:100vw; height:100vh; background:rgba(20,20,20,.83); align-items:center; justify-content:center;}
    .modal-content { background:#23272a; border-radius:22px; box-shadow:0 2px 32px #181a1b99; padding:2em; max-width:480px; width:90vw; position:relative; color:#f1f1f1;}
    .modal-close { position:absolute; top:1.2em; right:1.5em; background:none; border:none; color:#ffd700; font-size:2em; font-weight:bold; cursor:pointer; z-index:3;}
    .modal-title { color:#ffd700; font-size:1.23em; font-weight:bold; margin-bottom:.7em; letter-spacing:2px;}
    .modal-subtitle { color:#e56915; font-size:1.05em; font-weight:bold; margin:.8em 0 .3em 0;}
    .modal-list { list-style: disc; margin-left:1em; margin-bottom:1em; color: #ffd700;}
    @media (max-width:600px){ main{padding:1em;} .gym-card{padding:1.1em .6em;} .modal-content{padding:1em; font-size:1em;} }
  </style>
</head>
<body>
  <header>
    <h1 class="logo">IRON <span style="color:#e56915;">CROWN</span> COMBAT</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="fighters.html">Fighters</a>
      <a href="events.html">Events</a>
      <a href="rankings.html">Rankings</a>
      <a href="news.html">News</a>
      <a href="tournament.html">Tournament</a>
      <a href="about.html">About</a>
      <a href="rules.html">Test Your Metal</a>
      <a href="gyms.html" class="active">Gyms</a>
    </nav>
  </header>
  <main>
    <h2 style="color:#ffd700; text-align:center; margin-bottom:2em;">Iron Crown Combat Gyms</h2>
    <div class="gyms-grid" id="gyms-grid"></div>
    <div class="gym-modal" id="gym-modal">
      <div class="modal-content">
        <button class="modal-close" onclick="document.getElementById('gym-modal').style.display='none';">&times;</button>
        <!-- Modal details injected by JS -->
      </div>
    </div>
  </main>
  <footer class="footer" style="margin-top:2em; text-align:center;">
    &copy; 2025 Iron Crown Combat. All rights reserved.
  </footer>
  <script>
    // Update these to match your actual tab names!
    const sheetID = "1l8KRwK2D3Uyc6WTqqc6KO95nBqtfJ2WAnQSu6zyFicU";
    const managersSheet = "Managers"; // name of your managers tab
    const fightersSheet = "Fighter Tracker"; // name of your fighter tracker tab
    const managersURL = `https://opensheet.elk.sh/${sheetID}/${encodeURIComponent(managersSheet)}`;
    const fightersURL = `https://opensheet.elk.sh/${sheetID}/${encodeURIComponent(fightersSheet)}`;

    async function fetchGymsAndFighters() {
      // fetch managers and fighters
      const [managersRes, fightersRes] = await Promise.all([fetch(managersURL), fetch(fightersURL)]);
      const managersData = await managersRes.json();
      const fightersData = await fightersRes.json();
      // gyms = all rows in managers tab
      const gyms = managersData.map(mgr => ({
        name: mgr["Gym Name"],
        manager: mgr["Manager"],
        fighters: []
      }));
      // map gyms by name for quick assignment
      const gymMap = Object.fromEntries(gyms.map(g => [g.name, g]));
      // assign fighters by gym field (any column named "Gym")
      fightersData.forEach(f => {
        const fighterName = f["Fighter Name"] || f["Name"];
        const gymName = f["Gym"] || Object.values(f)[Object.values(f).length-1];
        if(gymMap[gymName]) gymMap[gymName].fighters.push(fighterName);
      });
      return gyms;
    }

    function renderGyms(gyms) {
      const grid = document.getElementById("gyms-grid");
      grid.innerHTML = "";
      gyms.forEach((gym) => {
        if(!gym.name) return;
        const card = document.createElement("div");
        card.className = "gym-card";
        card.innerHTML = `
          <div class="gym-name">${gym.name}</div>
          <div class="manager-name">Managed by: ${gym.manager}</div>
        `;
        card.addEventListener('click', () => showGymModal(gym));
        grid.appendChild(card);
      });
    }

    function showGymModal(gym) {
      const modal = document.getElementById("gym-modal");
      const content = modal.querySelector(".modal-content");
      content.innerHTML = `
        <button class="modal-close" onclick="document.getElementById('gym-modal').style.display='none';">&times;</button>
        <div class="modal-title">${gym.name}</div>
        <div class="modal-subtitle">Manager</div>
        <div style="font-weight:bold; margin-bottom:.9em; color:#e56915;">${gym.manager}</div>
        <div class="modal-subtitle">Fighters</div>
        <ul class="modal-list">
          ${gym.fighters.length ? gym.fighters.map(f => `<li>${f}</li>`).join('') : "<li>No fighters listed.</li>"}
        </ul>
      `;
      modal.style.display = "flex";
    }
    document.getElementById("gym-modal").addEventListener("click", function(e) {
      if (e.target === this) this.style.display='none';
    });
    // Load gyms/fighters on page load
    fetchGymsAndFighters().then(renderGyms);
  </script>
</body>
</html>
