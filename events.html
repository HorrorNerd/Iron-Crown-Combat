<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iron Crown Combat — Events</title>

  <meta name="description" content="Official Iron Crown Combat events, cards, and results." />
  <meta property="og:title" content="Iron Crown Combat — Events" />
  <meta property="og:description" content="Upcoming shows, past cards, and results." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/img/og-cover.png" />
  <meta name="theme-color" content="#0f1115" />

  <link rel="icon" href="assets/img/favicon.png" />
  <link rel="preload" href="assets/css/main.css" as="style" />
  <link rel="stylesheet" href="assets/css/main.css" />

  <style>
    :root{
      --gold:#ffd700; --bg:#0e0f13; --bg-2:#15171c; --surface:#13161b;
      --border:#2a2f39; --muted:#b9c0cf; --text:#e7ebf0; --shadow:0 16px 48px rgba(0,0,0,.35);
    }
    body { background: var(--bg); color: var(--text); margin: 0; }

    /* NAV */
    .header{position:sticky;top:0;z-index:20;background:rgba(20,22,23,.96);border-bottom:1px solid var(--border);backdrop-filter:saturate(1.1) blur(5px);}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:.6rem 0;}
    .logo img.site-logo{height:40px;width:auto;display:block;border-radius:6px;border:1px solid var(--border)}
    .menu{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
    .menu a{display:inline-flex;align-items:center;justify-content:center;padding:.45rem .7rem;border-radius:10px;border:1px solid transparent;color:var(--text);text-decoration:none}
    .menu a[aria-current="page"], .menu a:hover{border-color:#e0b15a;}

    .pagehead { text-align:center; padding: 1rem 1rem .5rem;}
    .pagehead h1 { margin: .25rem 0; color: var(--gold); }

    /* Toolbar */
    .toolbar{max-width:1200px;margin:.25rem auto 1rem;padding:0 1rem;display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .search{display:flex;gap:.5rem;align-items:center;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:.45rem .6rem;min-width:260px}
    .search input{all:unset;color:var(--text);width:240px}
    .chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--border);padding:.25rem .55rem;border-radius:999px;font-size:.9rem;background:var(--bg-2)}

    /* Featured */
    .featured-wrap{max-width:1200px;margin:0 auto 1.25rem;padding:0 1rem;display:grid;gap:1rem;grid-template-columns:1fr}
    @media (min-width:1100px){.featured-wrap{grid-template-columns:1fr 1fr}}

    .event-block{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
    .event-head{background:linear-gradient(135deg, rgba(224,177,90,.15), rgba(255,215,0,.05));padding:.9rem 1rem .75rem;border-bottom:1px solid var(--border);text-align:center}
    .event-name{font-weight:800;letter-spacing:.2px;color: var(--gold);margin:0;line-height:1.1;font-size:clamp(1.05rem,2.1vw,1.35rem);text-transform:uppercase}
    .event-date{margin:.25rem 0 0;color: var(--muted);font-size:.95rem}
    .event-poster{width:100%;max-height:360px;object-fit:cover;border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:none}
    .event-meta{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;padding:.8rem 1rem}
    .event-meta .stat{border:1px solid var(--border);background:var(--bg-2);border-radius:10px;padding:.45rem .6rem}

    /* Archive */
    .grid-wrap{max-width:1200px;margin:0 auto 2rem;padding:0 1rem}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
    .card-ev{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
    .card-ev img{display:block;width:100%;height:200px;object-fit:cover;border-bottom:1px solid var(--border)}
    .card-ev .body{padding:.75rem}
    .card-ev h3{margin:.1rem 0 .2rem;font-size:1.05rem}
    .muted{color:var(--muted)}
    .empty{padding:1rem;text-align:center;color:var(--muted)}

    /* Modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:12px;z-index:60}
    .modal-backdrop.show{display:flex}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;max-width:min(1000px,94vw);max-height:90vh;box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column}
    .modal header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;border-bottom:1px solid var(--border)}
    .modal header h2{margin:0}
    .modal .poster{width:100%;max-height:360px;object-fit:cover;border-bottom:1px solid var(--border)}
    .modal .content{overflow:auto}
    .close-btn{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:10px;padding:.35rem .6rem;cursor:pointer}
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a class="logo" href="index.html"><img class="site-logo" src="assets/images/logos/icc-logo.png" alt="ICC" /></a>
      <nav class="menu">
        <a href="index.html">Home</a>
        <a href="events.html" aria-current="page">Events</a>
        <a href="rankings.html">Rankings</a>
        <a href="fighters.html">Fighters</a>
        <a href="gyms.html">Gyms</a>
        <a href="news.html">News</a>
        <a href="rules.html">Rules</a>
        <a href="tournament.html">Tournaments</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <div class="pagehead">
    <h1>Events</h1>
    <p class="muted">Search the archive, see what's next, and dive into full cards.</p>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search events or fighters…" />
    </div>
    <span class="chip" id="countChip">0 events</span>
  </div>

  <!-- Featured -->
  <section id="featured" class="featured-wrap">
    <div class="event-block" id="upcomingBlock">
      <div class="event-head">
        <h2 class="event-name" id="upName">Upcoming Event</h2>
        <div class="event-date" id="upDate">—</div>
      </div>
      <img id="upPoster" class="event-poster" alt="Poster" />
      <div class="event-meta" id="upMeta"></div>
      <div class="fight-grid" id="upFights"><div class="empty">Loading…</div></div>
    </div>

    <div class="event-block" id="recentBlock">
      <div class="event-head">
        <h2 class="event-name" id="lastName">Most Recent Event</h2>
        <div class="event-date" id="lastDate">—</div>
      </div>
      <img id="lastPoster" class="event-poster" alt="Poster" />
      <div class="event-meta" id="lastMeta"></div>
      <div class="fight-grid" id="lastFights"><div class="empty">Loading…</div></div>
    </div>
  </section>

  <!-- Archive -->
  <div class="grid-wrap">
    <div id="cards" class="cards"></div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="evModal" aria-hidden="true">
    <div class="modal">
      <header>
        <h2 id="evTitle">Event</h2>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </header>
      <img id="evPoster" class="poster" alt="">
      <div class="content">
        <div id="evMeta" class="event-meta"></div>
        <div id="evFights" class="fight-grid"></div>
      </div>
    </div>
  </div>

  <footer class="footer"><div class="container cols"><small>© <span id="yr"></span> Iron Crown Combat</small></div></footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    const SHEET_ID = '1l8KRwK2D3Uyc6WTqqc6KO95nBqtfJ2WAnQSu6zyFicU';
    const GID_EVENTS_ALL = '676906080';
    const csvUrl = gid => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;

    function parseCSV(text){
      const lines = text.split('\n').filter(l=>l.trim());
      const headers = lines.shift().split(',').map(h=>h.trim());
      return lines.map(line=>{
        const vals=line.split(','); const o={}; headers.forEach((h,i)=>o[h]=vals[i]?vals[i].trim():''); return o;
      });
    }

    const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
    const posterFor = ev => {const m=/crucible\s*(\d+)/i.exec(ev.name||'');return m?`assets/images/posters/${m[1]}.png`:null;}
    const thumbFor = ev => {const m=/crucible\s*(\d+)/i.exec(ev.name||'');return m?`assets/images/thumbs/${m[1]}.png`:null;}

    function parseEventTitle(s){
      const m = /^(.+?)\((\d{2})-(\d{2})-(\d{4})\)$/.exec(s.trim());
      if(!m) return {name:s.trim(),date:null};
      const [, raw, mm,dd,yyyy]=m; return {name:raw.trim(),date:new Date(`${yyyy}-${mm}-${dd}`)};
    }

    function awardMapForEvent(fights){
      const map={}; fights.forEach(f=>{if(f.bonus&&f.winner){map[f.bonus]=f.winner;}}); return map;
    }

    function fightRow(f){
      const wa=f.winner===f.a, wb=f.winner===f.b;
      return `<div class="fight ${wa?'win-left':''} ${wb?'win-right':''}">
        <div class="headshot"><img src="assets/images/fighters/headshots/${slugify(f.a)}.png"><div class="name-overlay ${wa?'winner':''}">${f.a}</div></div>
        <div class="vs">VS</div>
        <div class="headshot"><img src="assets/images/fighters/headshots/${slugify(f.b)}.png"><div class="name-overlay ${wb?'winner':''}">${f.b}</div></div>
      </div>`;
    }

    function statMeta(id,ev){
      const meta=document.getElementById(id);const awards=awardMapForEvent(ev.fights);let html=`<span class="stat"><b>${ev.fights.length}</b> matches</span>`;
      for(const k in awards){html+=`<span class="stat">${k}: <b>${awards[k]}</b></span>`;} meta.innerHTML=html;
    }

    async function loadEvents(){
      const res=await fetch(csvUrl(GID_EVENTS_ALL));const rows=parseCSV(await res.text());const map=new Map();
      let order=0;
      rows.forEach(r=>{
        const {name,date}=parseEventTitle(r['Event']); if(!name||!date) return;
        if(!map.has(name+date)) map.set(name+date,{name,date,fights:[]});
        map.get(name+date).fights.push({a:r['Fighter A'],b:r['Fighter B'],winner:r['Winner'],bonus:r['bonus type']});
      });
      return Array.from(map.values()).sort((a,b)=>a.date-b.date);
    }

    function setPoster(el,src){if(!src){el.style.display='none';return;} el.src=src;el.style.display='';}

    function openModal(ev){
      document.getElementById('evTitle').textContent=ev.name;
      setPoster(document.getElementById('evPoster'),posterFor(ev));
      statMeta('evMeta',ev);
      document.getElementById('evFights').innerHTML=ev.fights.map(fightRow).join('');
      const m=document.getElementById('evModal');m.classList.add('show');m.setAttribute('aria-hidden','false');
    }
    function closeModal(){document.getElementById('evModal').classList.remove('show');}

    (async()=>{
      const events=await loadEvents(); const today=new Date(); today.setHours(0,0,0,0);
      const upcoming=events.find(e=>e.date>=today); const last=events.filter(e=>e.date<today).slice(-1)[0];
      if(upcoming){document.getElementById('upName').textContent=upcoming.name;document.getElementById('upDate').textContent=upcoming.date.toDateString();setPoster(document.getElementById('upPoster'),posterFor(upcoming));statMeta('upMeta',upcoming);document.getElementById('upFights').innerHTML=upcoming.fights.map(fightRow).join('');}
      if(last){document.getElementById('lastName').textContent=last.name;document.getElementById('lastDate').textContent=last.date.toDateString();setPoster(document.getElementById('lastPoster'),posterFor(last));statMeta('lastMeta',last);document.getElementById('lastFights').innerHTML=last.fights.map(fightRow).join('');}

      const archive=events.filter(e=>e.date<today).reverse();
      const cards=document.getElementById('cards');cards.innerHTML=archive.map((ev,i)=>`
        <article class="card-ev" onclick="openModal(events[${i}])">
          ${thumbFor(ev)?`<img src="${thumbFor(ev)}" alt="thumb">`:''}
          <div class="body"><h3>${ev.name}</h3><div class="muted">${ev.date.toDateString()}</div></div>
        </article>`).join('');
      window.events=archive; // store for modal open
    })();
  </script>
</body>
</html>
