<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iron Crown Combat — Events</title>

  <link rel="icon" href="assets/img/favicon.png">
  <meta name="description" content="Official Iron Crown Combat events, countdowns, cards, and results." />
  <meta property="og:title" content="Iron Crown Combat — Events" />
  <meta property="og:description" content="Upcoming shows, countdown, cards, and results." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/img/og-cover.png" />
  <meta name="theme-color" content="#0f1115" />

  <link rel="preload" href="assets/css/main.css" as="style" />
  <link rel="stylesheet" href="assets/css/main.css" />

  <style>
    :root{
      --gold:#ffd700; --gold2:#e0b15a;
      --bg:#0e0f13; --bg-2:#15171c; --surface:#13161b;
      --border:#2a2f39; --muted:#b9c0cf; --text:#e7ebf0;
      --shadow:0 16px 48px rgba(0,0,0,.35);
    }
    body { background: var(--bg); color: var(--text); margin: 0; }

    /* ===== Hero ===== */
    .hero-wrap{ position:relative; overflow:hidden; border-bottom:1px solid var(--border);
      background: radial-gradient(1200px 500px at 50% -10%, rgba(224,177,90,.18), transparent 60%), #0d0f14; }
    .hero{ max-width:1200px; margin:0 auto; padding: 1.25rem 1rem 1rem;
      display:grid; gap:1rem; grid-template-columns: 1.3fr 1fr; align-items:center; }
    .hero-left{ display:grid; gap:.7rem; }
    .eyebrow{ color: var(--muted); font-weight:700; letter-spacing:.12em; text-transform:uppercase; font-size:.85rem; }
    .hero h1{ margin:.1rem 0; font-size: clamp(1.4rem, 3vw, 2rem); color: var(--gold); letter-spacing:.02em; }
    .hero .date{ color: var(--muted); }
    .hero-actions{ display:flex; gap:.6rem; flex-wrap:wrap; margin-top:.2rem; }
    .hero .btn.gold{ border-color: var(--gold2); }

    .countdown{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
    .cd-item{ min-width:80px; text-align:center; background: var(--bg-2); border:1px solid var(--border); border-radius:10px; padding:.5rem .6rem; }
    .cd-num{ font-size:1.3rem; font-weight:900; }
    .cd-lbl{ font-size:.8rem; color:var(--muted); }

    .poster{ justify-self:center; width:100%; max-width:440px; aspect-ratio: 3/4;
      border-radius:14px; overflow:hidden; border:1px solid var(--border); background:#0b0c10;
      display:flex; align-items:center; justify-content:center; box-shadow: var(--shadow); }
    .poster img{ width:100%; height:100%; object-fit:cover; display:block; }
    .poster .ph{ color:var(--muted); padding:1rem; text-align:center; }
    @media (max-width: 980px){ .hero{ grid-template-columns: 1fr; } .poster{ max-width:520px; } }

    /* ===== Spotlight ===== */
    .spotlight{ max-width:1200px; margin: 1rem auto; padding: 0 1rem 1rem; }
    .spotlight .card{ overflow:hidden; }
    .me-grid{ display:grid; grid-template-columns: 1fr auto 1fr; gap:1rem; align-items:center; }
    .me-side{ display:grid; gap:.5rem; align-content:center; justify-items:center; }
    .me-head{ width:100%; max-width:360px; aspect-ratio:1/1; border-radius:14px; overflow:hidden;
      border:1px solid var(--border); background:#0b0c10; box-shadow: var(--shadow);
      display:flex; align-items:flex-end; justify-content:center; position:relative; }
    .me-head img{ width:100%; height:100%; object-fit:cover; display:block; }
    .me-name{ position:absolute; left:0; right:0; bottom:0; padding:.6rem .8rem; text-align:center; color:#fff; font-weight:900;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.85) 50%); text-shadow: 0 2px 12px rgba(0,0,0,.8); }
    .me-vs{ font-weight:900; font-size: clamp(1.4rem, 4vw, 2rem); padding:.5rem .9rem; border:1px solid var(--border); border-radius:999px;
      background: radial-gradient(ellipse at center, rgba(255,215,0,.2), rgba(224,177,90,.08) 55%, transparent 80%);
      color: var(--gold); text-shadow: 0 1px 10px rgba(255,215,0,.2); }
    .me-meta{ text-align:center; color: var(--muted); margin-top:.4rem; }

    /* ===== Filters ===== */
    .filters{ max-width:1200px; margin: 0.25rem auto 0; padding: 0 1rem 0.6rem;
      display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .filters .field{ display:flex; gap:.4rem; align-items:center; border:1px solid var(--border); background: var(--bg-2); border-radius:10px; padding:.4rem .6rem; }
    .filters input{ background:transparent; border:0; outline:0; color:var(--text); min-width:220px; }

    /* ===== Past Events ===== */
    .events-grid{ max-width:1200px; margin: 0 auto 1.5rem; padding: 0 1rem;
      display:grid; gap:1rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .ev-card{ background: var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow: var(--shadow);
      display:grid; grid-template-rows:auto 1fr auto; cursor:pointer; }
    .ev-card:focus-within, .ev-card:hover{ outline: 1px solid var(--gold2); outline-offset: -1px; }
    .ev-cover{ aspect-ratio: 16/9; background:#0b0c10; }
    .ev-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
    .ev-body{ padding:.8rem; display:grid; gap:.35rem; }
    .ev-title{ font-weight:800; color: var(--gold); }
    .ev-date{ color:var(--muted); font-size:.92rem; }
    .ev-meta{ color:var(--muted); font-size:.9rem; }
    .ev-actions{ display:flex; gap:.5rem; padding:.8rem; border-top:1px solid var(--border); }

    /* ===== Fights ===== */
    .fight-grid{ display:flex; flex-direction:column; gap:.7rem; }
    .fight{ display:grid; grid-template-columns: 1fr auto 1fr; gap:.7rem; align-items:center;
      background: var(--bg-2); border:1px solid var(--border); border-radius:12px; padding:.75rem; min-height:170px; position:relative; overflow:hidden; }
    .headshot{ position:relative; height:170px; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:#0b0c10; display:flex; align-items:flex-end; justify-content:center; }
    .headshot img{ width:100%; height:100%; object-fit:cover; display:block; }
    .name-overlay{ position:absolute; left:0; right:0; bottom:0; padding:.5rem .7rem; text-align:center; color:#fff; font-weight:800;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.9) 45%); text-shadow: 0 2px 10px rgba(0,0,0,.9); }
    .vs{ display:flex; align-items:center; justify-content:center; width:64px; height:64px; border-radius:50%;
      border:1px solid var(--border); color: var(--gold); font-weight:900; box-shadow: inset 0 0 20px rgba(255,215,0,.15);
      background: radial-gradient(ellipse at center, rgba(255,215,0,.2), rgba(224,177,90,.08) 60%, transparent 100%); }
    .name-overlay.winner{ color:#5cff9d; text-shadow: 0 0 8px rgba(92,255,157,.65), 0 2px 8px rgba(0,0,0,.9); }

    @media (max-width: 680px){
      .fight{ grid-template-columns: 1fr; min-height:unset; }
      .headshot{ height:220px; }
      .vs{ margin:.2rem auto; }
      .me-grid{ grid-template-columns: 1fr; }
      .me-head{ max-width:520px; aspect-ratio: 4/3; }
    }

    /* ===== Modal (poster + write-up + card) ===== */
    .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:60; padding: 1rem; }
    .modal-backdrop.show{ display:flex; }
    .modal{
      background: var(--surface);
      border:1px solid var(--border);
      border-radius:16px;
      max-width:min(1100px, 94vw);
      max-height:92vh;
      overflow:auto;
      box-shadow: var(--shadow);
    }
    .modal header{ display:flex; align-items:center; justify-content:space-between; padding:.8rem 1rem; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:2; }
    .modal .body{ display:grid; grid-template-columns: 420px 1fr; gap:0; }
    .modal .poster-wrap{ padding:1rem; border-right:1px solid var(--border); background: var(--bg); }
    .modal .poster-wrap img{ width:100%; height:auto; border-radius:12px; border:1px solid var(--border); display:block; }
    .modal .content{ padding:1rem; display:grid; gap:.6rem; }
    .modal .meta{ color:var(--muted); }
    .modal .cardbox{ border:1px solid var(--border); border-radius:12px; padding:.8rem; background: var(--bg); }
    .modal .close{ border:1px solid var(--border); background:transparent; color:var(--text); border-radius:10px; padding:.4rem .7rem; cursor:pointer; }
    .modal .close:hover{ border-color: var(--gold2); }
    @media (max-width: 980px){
      .modal .body{ grid-template-columns: 1fr; }
      .modal .poster-wrap{ border-right:none; border-bottom:1px solid var(--border); }
    }.modal .body{
      grid-template-columns: minmax(320px, 420px) 1fr;
      gap: 0;
    }

    .modal .poster-wrap{
      padding: 1rem;
      border-right: 1px solid var(--border);
      background: var(--bg);
    }

    .modal .content{
      padding: 1.2rem 1.4rem;
      max-width: 820px;
      margin: 0 auto;
      text-align: center;
    }

    .modal .content .prose{
      max-width: 68ch;
      margin: 0.25rem auto 0;
      text-align: left;
    }

    .modal .content .prose p{
      margin: 0 0 .9rem;
    }

    @media (min-width: 1400px){
      .modal .body{
        grid-template-columns: minmax(300px, 400px) 1fr;
      }
    }

    @media (max-width: 980px){
      .modal .body{ grid-template-columns: 1fr; }
      .modal .poster-wrap{ border-right: none; border-bottom: 1px solid var(--border); }
      .modal .content{ max-width: 720px; }
  </style>
</head>
<body>

  <!-- Shared navbar -->
  <div id="navbar"></div>

  <!-- HERO (Upcoming) -->
  <section class="hero-wrap">
    <div class="hero" id="hero">
      <div class="hero-left">
        <div class="eyebrow">Next Crucible</div>
        <h1 id="heroTitle">Loading upcoming event…</h1>
        <div class="date" id="heroDate"></div>
        <div class="countdown" id="countdown" aria-live="polite" style="display:none">
          <div class="cd-item"><div class="cd-num" id="d">0</div><div class="cd-lbl">Days</div></div>
          <div class="cd-item"><div class="cd-num" id="h">0</div><div class="cd-lbl">Hours</div></div>
          <div class="cd-item"><div class="cd-num" id="m">0</div><div class="cd-lbl">Min</div></div>
          <div class="cd-item"><div class="cd-num" id="s">0</div><div class="cd-lbl">Sec</div></div>
        </div>
        <div class="hero-actions">
          <a class="btn gold" href="https://www.twitch.tv/swttngaming?sr=a" target="_blank" rel="noopener">Watch Live on Twitch</a>
          <a class="btn" href="#archive">See Past Events</a>
        </div>
      </div>
      <div class="poster">
        <img id="heroPoster" alt="Event poster" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',innerHTML:'Poster coming soon'}))">
      </div>
    </div>
  </section>

  <!-- Spotlight (Main Event) -->
  <section class="spotlight">
    <div class="card" id="spotlightCard" style="display:none;">
      <div class="me-grid">
        <div class="me-side">
          <div class="me-head"><img id="meAImg" alt=""><div id="meAName" class="me-name">—</div></div>
        </div>
        <div class="me-vs">VS</div>
        <div class="me-side">
          <div class="me-head"><img id="meBImg" alt=""><div id="meBName" class="me-name">—</div></div>
        </div>
      </div>
      <div class="me-meta" id="meMeta">—</div>
      <div class="fight-grid" id="upFightList" style="padding:1rem 1rem 1.2rem;"></div>
    </div>
  </section>

  <!-- Filters -->
  <section class="filters">
    <div class="field">🔎 <input id="search" type="search" placeholder="Filter past events by fighter or title…"></div>
    <div class="meta" id="resultCount"></div>
  </section>

  <!-- Past Events Grid -->
  <section id="archive" class="events-grid"></section>

  <!-- Modal (poster + write-up + card) -->
  <div id="evModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="evTitle">
      <header>
        <h3 id="evTitle" style="margin:0">Event</h3>
        <button class="close" data-close-modal aria-label="Close">✕</button>
      </header>
      <div class="body">
        <div class="poster-wrap">
          <img id="evPoster" alt="Event poster">
        </div>
        <div class="content">
          <div id="evDate" class="meta">—</div>
          <div id="evWriteup" class="prose">—</div>
          <div class="cardbox">
            <h4 style="margin:.1rem 0 .6rem">Full Card</h4>
            <div id="evCard" class="fight-grid"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container cols">
      <small>© <span id="yr"></span> Iron Crown Combat · A TNGaming production</small>
    </div>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    // ====== CONFIG ======
    const SHEET_ID = '1l8KRwK2D3Uyc6WTqqc6KO95nBqtfJ2WAnQSu6zyFicU';
    const GID_EVENTS_ALL = '676906080';
    const EVENTS_JSON = 'assets/data/events.json';
    const VODS_URL = 'assets/data/vods.json';

    const csvUrl = gid => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;

    // ===== Helpers =====
    function parseCSV(text){
      const lines = text.replace(/\r/g,'').split('\n').filter(l=>l.length);
      if(!lines.length) return [];
      const rows = lines.map(line=>{
        const out=[]; let cur='',q=false;
        for(let i=0;i<line.length;i++){
          const c=line[i], n=line[i+1];
          if(c==='"'&&n==='"'){cur+='"'; i++; continue;}
          if(c==='"'){q=!q; continue;}
          if(c===','&&!q){ out.push(cur); cur=''; continue; }
          cur+=c;
        }
        out.push(cur); return out;
      });
      const headers = rows[0].map(h=>h.trim());
      return rows.slice(1).map(r=>{
        const o={}; headers.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o;
      });
    }

    const slugify = s => (s||'').toLowerCase()
      .normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');

    const headshotPath = (name) => `assets/images/fighters/headshots/${slugify(name)}.png`;

    // Extract Crucible number (e.g., "Crucible 01" -> "01")
    function crucibleNum(name){
      const m = /crucible\s*(\d+)/i.exec(name || '');
      if (!m) return null;
      const n = m[1];
      return n.length === 1 ? '0'+n : n; // 1 -> 01
    }

    function parseEventTitle(s){
      const raw = (s||'').trim();
      const mParens = /\(([^)]+)\)/.exec(raw);
      let date = null, dateStr = '';
      if (mParens){
        const inside = mParens[1].trim();
        const parts = inside.replace(/[,]/g,'').trim();
        if (/^\d{2}[-/]\d{2}[-/]\d{4}$/.test(parts)){
          const [mm,dd,yyyy] = parts.split(/[-/]/);
          date = new Date(`${yyyy}-${mm}-${dd}T20:00:00`);
          dateStr = `${yyyy}-${mm}-${dd}`;
        } else if (/^\d{4}-\d{2}-\d{2}$/.test(parts)){
          const [yyyy,mm,dd] = parts.split('-');
          date = new Date(`${yyyy}-${mm}-${dd}T20:00:00`);
          dateStr = `${yyyy}-${mm}-${dd}`;
        } else {
          const tryDate = new Date(parts + ' 20:00:00');
          if (!isNaN(tryDate)) {
            date = tryDate;
            const yyyy = tryDate.getFullYear();
            const mm = String(tryDate.getMonth()+1).padStart(2,'0');
            const dd = String(tryDate.getDate()).padStart(2,'0');
            dateStr = `${yyyy}-${mm}-${dd}`;
          }
        }
      }
      if (!date){
        const mNums = /(\d{4})[-/](\d{2})[-/](\d{2})|(\d{2})[-/](\d{2})[-/](\d{4})/.exec(raw);
        if (mNums){
          if (mNums[1]){
            const [yyyy,mm,dd]=[mNums[1],mNums[2],mNums[3]];
            date = new Date(`${yyyy}-${mm}-${dd}T20:00:00`);
            dateStr = `${yyyy}-${mm}-${dd}`;
          } else {
            const [mm,dd,yyyy]=[mNums[4],mNums[5],mNums[6]];
            date = new Date(`${yyyy}-${mm}-${dd}T20:00:00`);
            dateStr = `${yyyy}-${mm}-${dd}`;
          }
        }
      }
      const name = raw.replace(/\s*\([^)]+\)\s*$/,'').trim() || 'Event';
      return { name, date, dateStr };
    }

    function toDateStr(d) {
      return d ? d.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' }) : '';
    }

    async function fetchCSV(gid){ const r = await fetch(csvUrl(gid), {cache:'no-store'}); if(!r.ok) throw new Error('CSV '+gid); return parseCSV(await r.text()); }
    async function fetchJSON(url){ try{ const r = await fetch(url, {cache:'no-store'}); if(!r.ok) return null; return await r.json(); } catch { return null; } }

    function buildMetaIndex(meta){
      const idx = new Map();
      const norm = s => (s||'').trim();
      const bySlug = s => slugify(s||'');
      const byNum  = s => crucibleNum(s||'');
      if (meta && Array.isArray(meta.events)){
        for (const e of meta.events){
          if (!e || !e.name) continue;
          const obj = { poster:e.poster||'', thumb:e.thumb||'', writeup:e.writeup||'' };
          const exact = norm(e.name);
          const slug  = bySlug(e.name);
          const num   = byNum(e.name); // "01" or null
          if (exact) idx.set(`name:${exact}`, obj);
          if (slug)  idx.set(`slug:${slug}`,   obj);
          if (num)   idx.set(`num:${num}`,     obj);
        }
      }
      return idx;
    }

    function lookupMeta(index, name){
      const exact = (name||'').trim();
      const slug  = slugify(name||'');
      const num   = crucibleNum(name||'');
      return index.get(`name:${exact}`) || index.get(`slug:${slug}`) || (num && index.get(`num:${num}`)) || {};
    }

    async function loadEvents(){
      const [rows, meta] = await Promise.all([fetchCSV(GID_EVENTS_ALL), fetchJSON(EVENTS_JSON)]);
      const metaIndex = buildMetaIndex(meta||{});

      const map = new Map(); // key: name||dateStr
      let order = 0;
      for (const r of rows){
        const evt = (r['Event'] || '').trim();
        if(!evt) continue;
        const { name, date, dateStr } = parseEventTitle(evt);
        if(!name || !(date instanceof Date) || isNaN(date)) continue;

        const key = `${name}||${dateStr}`;
        if(!map.has(key)) {
          map.set(key, { name, date, dateStr, fights: [], media: lookupMeta(metaIndex, name) });
        }

        const a = (r['Fighter A'] || '').trim();
        const b = (r['Fighter B'] || '').trim();
        if (a || b){
          map.get(key).fights.push({
            order: ++order,
            a: a || 'TBA',
            b: b || 'TBA',
            winner: (r['Winner']||'').trim(),
            bonus: (r['bonus type']||r['Bonus']||'').trim(),
            rating: (r['Match Rating']||r['Rating']||'').trim()
          });
        }
      }

      const events = Array.from(map.values())
        .map(e => ({...e, fights: e.fights.sort((x,y)=>x.order - y.order)}))
        .sort((a,b)=> a.date - b.date);

      return events;
    }

    // Images: prefer events.json paths; else fall back to posters/thumbs folders by Crucible number
    function posterFallbackByNumber(name){
      const num = crucibleNum(name);
      if (!num) return null;
      // try .png then .jpg
      return [`assets/images/posters/${num}.png`, `assets/images/posters/${num}.jpg`];
    }
    function thumbFallbackByNumber(name){
      const num = crucibleNum(name);
      if (!num) return null;
      return [`assets/images/thumbs/${num}.png`, `assets/images/thumbs/${num}.jpg`];
    }

    function eventPoster(ev){
      if (ev.media && ev.media.poster) return ev.media.poster;
      const tries = posterFallbackByNumber(ev.name) || [];
      return tries[0] || '';
    }
    function eventThumb(ev){
      if (ev.media && ev.media.thumb) return ev.media.thumb;
      const tries = thumbFallbackByNumber(ev.name) || [];
      return tries[0] || eventPoster(ev); // if no thumb, reuse poster
    }

    function setHero(up){
      const t = document.getElementById('heroTitle');
      const d = document.getElementById('heroDate');
      const p = document.getElementById('heroPoster');
      if (!up){
        t.textContent = 'No upcoming event scheduled';
        d.textContent = '';
        p.replaceWith(Object.assign(document.createElement('div'),{className:'ph',innerHTML:'Poster coming soon'}));
        document.getElementById('countdown').style.display='none';
        return;
      }
      t.textContent = up.name;
      d.textContent = toDateStr(up.date);
      p.src = eventPoster(up);

      // Countdown
      const cd = document.getElementById('countdown');
      cd.style.display = '';
      const dEl = document.getElementById('d');
      const hEl = document.getElementById('h');
      const mEl = document.getElementById('m');
      const sEl = document.getElementById('s');

      function tick(){
        const now = new Date();
        const diff = up.date - now;
        if (diff <= 0){
          dEl.textContent = '0'; hEl.textContent = '0'; mEl.textContent = '0'; sEl.textContent = '0';
          return;
        }
        const sec = Math.floor(diff/1000);
        const days = Math.floor(sec/86400);
        const hours = Math.floor((sec%86400)/3600);
        const mins = Math.floor((sec%3600)/60);
        const secs = sec%60;
        dEl.textContent = days;
        hEl.textContent = String(hours).padStart(2,'0');
        mEl.textContent = String(mins).padStart(2,'0');
        sEl.textContent = String(secs).padStart(2,'0');
      }
      tick();
      setInterval(tick, 1000);
    }

    function fightRow(f){
      const winnerA = f.winner && f.winner === f.a;
      const winnerB = f.winner && f.winner === f.b;
      return `
        <div class="fight">
          <div class="headshot">
            <img src="${headshotPath(f.a)}" alt="${f.a}" onerror="this.style.opacity=.25">
            <div class="name-overlay ${winnerA ? 'winner' : ''}">${f.a}</div>
          </div>
          <div class="vs">VS</div>
          <div class="headshot">
            <img src="${headshotPath(f.b)}" alt="${f.b}" onerror="this.style.opacity=.25">
            <div class="name-overlay ${winnerB ? 'winner' : ''}">${f.b}</div>
          </div>
        </div>
      `;
    }

    function renderSpotlight(up){
      const card = document.getElementById('spotlightCard');
      if (!up || !up.fights.length){ card.style.display='none'; return; }
      card.style.display='';
      const main = up.fights[up.fights.length - 1];
      document.getElementById('meAImg').src = headshotPath(main.a);
      document.getElementById('meBImg').src = headshotPath(main.b);
      document.getElementById('meAName').textContent = main.a;
      document.getElementById('meBName').textContent = main.b;
      document.getElementById('meMeta').textContent = 'Five rounds · Five minutes · No judges · Ring only';
      document.getElementById('upFightList').innerHTML = up.fights.map(fightRow).join('');
    }

    function averageRating(fights){
      const nums = fights.map(f => parseFloat(String(f.rating).replace(/[^0-9.]/g,''))).filter(n => !isNaN(n));
      if (!nums.length) return null;
      const avg = nums.reduce((a,b)=>a+b,0)/nums.length;
      return Math.round(avg * 10)/10;
    }

    function awardsDetail(fights){
      const out = { fotn: [], ko: [], sub: [] };
      fights.forEach(f => {
        const bonus = (f.bonus || '').toLowerCase();
        if (!bonus) return;
        const isFOTN = /fight\s*of\s*the\s*night/i.test(bonus);
        const isKO   = /\bko\b|\bknockout\b/i.test(bonus);
        const isSUB  = /submission\s*of\s*the\s*night|\bsub\b/i.test(bonus);
        if (isFOTN) out.fotn.push(`${f.a} vs ${f.b}`);
        if (isKO)  out.ko.push(f.winner || f.a || f.b || '');
        if (isSUB) out.sub.push(f.winner || f.a || f.b || '');
      });
      const parts = [];
      if (out.fotn.length) parts.push(`FOTN: ${out.fotn.join(', ')}`);
      if (out.ko.length)   parts.push(`KO: ${out.ko.join(', ')}`);
      if (out.sub.length)  parts.push(`SUB: ${out.sub.join(', ')}`);
      return parts.join(' · ');
    }

    function eventCard(ev, vodUrl){
      const avg = averageRating(ev.fights);
      const awards = awardsDetail(ev.fights);
      const thumb = eventThumb(ev);
      const key = `${ev.name}||${ev.dateStr}`;

      return `
        <article class="ev-card" data-key="${key}" tabindex="0">
          <div class="ev-cover">
            <img src="${thumb}" alt="${ev.name} cover" onerror="this.style.opacity=.25">
          </div>
          <div class="ev-body">
            <div class="ev-title">${ev.name}</div>
            <div class="ev-date">${toDateStr(ev.date)}</div>
            <div class="ev-meta">
              ${ev.fights.length} fights${avg ? ` · Avg ★${avg}`:''}${awards?` · ${awards}`:''}
            </div>
          </div>
          <div class="ev-actions">
            ${vodUrl ? `<a class="btn" href="${vodUrl}" target="_blank" rel="noopener">▶ Watch Replay</a>` : ''}
            <button class="btn" data-open-modal type="button">Details</button>
          </div>
        </article>
      `;
    }

    function renderArchive(past, vods){
      const host = document.getElementById('archive');
      if (!past.length){
        host.innerHTML = `<div class="card" style="grid-column:1/-1;text-align:center">No past events yet.</div>`;
        return;
      }
      host.innerHTML = past.slice().sort((a,b)=> b.date - a.date).map(ev=>{
        const vod = (vods && (vods[ev.name] || vods[slugify(ev.name)])) || '';
        return eventCard(ev, vod);
      }).join('');
      document.getElementById('resultCount').textContent = `${past.length} past event${past.length===1?'':'s'}`;
    }

    function wireFilter(allPast){
      const input = document.getElementById('search');
      const host = document.getElementById('archive');
      function apply(){
        const q = input.value.trim().toLowerCase();
        const cards = [...host.querySelectorAll('.ev-card')];
        if (!q){
          cards.forEach(c=>c.style.display='');
          document.getElementById('resultCount').textContent = `${allPast.length} past events`;
          return;
        }
        const filtered = [];
        allPast.forEach((ev, i)=>{
          const inTitle = ev.name.toLowerCase().includes(q);
          const inRoster = ev.fights.some(f => (f.a && f.a.toLowerCase().includes(q)) || (f.b && f.b.toLowerCase().includes(q)));
          const card = cards[i];
          const show = inTitle || inRoster;
          if (card) card.style.display = show ? '' : 'none';
          if (show) filtered.push(ev);
        });
        document.getElementById('resultCount').textContent = `${filtered.length} result${filtered.length===1?'':'s'}`;
      }
      input.addEventListener('input', apply);
    }

    // ===== Modal wiring =====
    function fightListHTML(ev){
      if (!ev.fights || !ev.fights.length) {
        return `<div class="meta">No fights logged yet.</div>`;
      }
      return ev.fights.map(fightRow).join('');
    }

    function wireModal(events){
      const modal = document.getElementById('evModal');
      const titleEl = document.getElementById('evTitle');
      const dateEl  = document.getElementById('evDate');
      const writeEl = document.getElementById('evWriteup');
      const posterEl= document.getElementById('evPoster');
      const cardEl  = document.getElementById('evCard');

      function open(ev){
        titleEl.textContent = ev.name;
        dateEl.textContent = toDateStr(ev.date);

        const writeup = ev.media && ev.media.writeup ? ev.media.writeup : '';
        writeEl.innerHTML = writeup || '<p class="meta">No write-up available.</p>';

        posterEl.src = eventPoster(ev);
        cardEl.innerHTML = fightListHTML(ev);

        modal.classList.add('show');
        modal.setAttribute('aria-hidden','false');
        document.body.style.overflow='hidden';
      }
      function close(){
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden','true');
        document.body.style.overflow='';
      }

      document.addEventListener('click', (e)=>{
        if (e.target.closest('[data-open-modal]')){
          const card = e.target.closest('.ev-card');
          if (!card) return;
          const key = card.getAttribute('data-key');
          const ev = events.find(x => `${x.name}||${x.dateStr}` === key);
          if (ev) open(ev);
        }
        if (e.target.closest('[data-close-modal]') || e.target === modal) close();
      });
      document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') close(); });
    }

    (async function(){
      try{
        const [events, vods] = await Promise.all([loadEvents(), fetchJSON(VODS_URL)]);

        const now = new Date(); now.setSeconds(0,0);
        const future = events.filter(e => e.date && e.date >= now).sort((a,b)=> a.date - b.date);
        const upcoming = future[0] || null;
        const past = events.filter(e => e.date && e.date < now);

        setHero(upcoming);
        renderSpotlight(upcoming);
        renderArchive(past, vods || {});
        wireFilter(past);
        wireModal(events);
      }catch(err){
        console.error(err);
        document.getElementById('heroTitle').textContent = 'Failed to load events';
      }
    })();
  </script>

  <!-- Load shared navbar -->
  <script>
    fetch("/Iron-Crown-Combat/navbar.html")
      .then(r => r.text())
      .then(html => {
        const mount = document.getElementById("navbar");
        if (mount) mount.innerHTML = html;
        const btn = document.getElementById("menuBtn");
        const menu = document.getElementById("primaryMenu");
        if (btn && menu){
          btn.addEventListener("click", () => {
            const open = menu.classList.toggle("open");
            btn.setAttribute("aria-expanded", open ? "true" : "false");
          });
        }
        const path = location.pathname;
        document.querySelectorAll("#primaryMenu a.item").forEach(a => {
          try {
            const hrefPath = new URL(a.href, location.origin).pathname;
            if (hrefPath === path) a.classList.add("active");
          } catch(e){}
        });
      });
  </script>
</body>
</html>
