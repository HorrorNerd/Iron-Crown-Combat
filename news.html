<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iron Crown Combat — News</title>
  <link rel="stylesheet" href="assets/css/main.css" />

  <!-- Modal styles kept inline so this page works by itself -->
  <style>
    .news-head { display:flex; flex-wrap:wrap; align-items:center; gap:.75rem; justify-content:space-between; }
    .news-controls { display:flex; align-items:center; gap:.5rem; }
    .news-controls label { font-size:.9rem; color: var(--muted); }
    .news-controls select { background:var(--bg-2); color:inherit; border:1px solid var(--border); border-radius:12px; padding:.4rem .75rem; font:inherit; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; }
    .modal-backdrop.show { display: flex; }
    .modal { background: var(--bg-2); border: 1px solid var(--border); border-radius: 16px; max-width: min(800px, 92%); max-height: 85vh; overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
    .modal header { display:flex; justify-content:space-between; align-items:center; padding: .8rem 1rem; border-bottom:1px solid var(--border); }
    .modal .content { padding: 1rem; }
    .modal .meta { color: var(--muted); margin-bottom: .5rem; }
    .modal [data-modal-close] { cursor: pointer; }
  </style>
</head>
<body>

  <!-- Shared navbar placeholder; populated by navbar.html -->
  <div id="navbar"></div>

  <main class="container">
    <div class="pagehead news-head">
      <h1 style="margin:0;">News</h1>
      <div class="news-controls">
        <label for="news-sort">Sort</label>
        <select id="news-sort" aria-label="Sort articles">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
      </div>
    </div>

    <!-- List populated from local JSON -->
    <section class="grid grid-2" id="news-list">
      <div class="card">Loading news…</div>
    </section>

    <!-- Accessible modal -->
    <div class="modal-backdrop" id="news-modal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="news-modal-title">
        <header>
          <h3 id="news-modal-title">Title</h3>
          <button class="btn" data-modal-close aria-label="Close">✕</button>
        </header>
        <div class="content">
          <div id="news-modal-date" class="meta"></div>
          <div id="news-modal-body" class="prose"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container cols">
      <small>© <span id="yr"></span> Iron Crown Combat · A TNGaming production</small>
    </div>
  </footer>

  <script>
    // --- year ---
    document.getElementById('yr').textContent = new Date().getFullYear();

    // --- NEWS (local JSON) ---
    (function(){
      const list   = document.getElementById('news-list');
      const sort   = document.getElementById('news-sort');
      const modal  = document.getElementById('news-modal');
      const mTitle = document.getElementById('news-modal-title');
      const mDate  = document.getElementById('news-modal-date');
      const mBody  = document.getElementById('news-modal-body');

      let NEWS = [];

      const dateFmt = new Intl.DateTimeFormat('en-US', { month:'short', day:'numeric', year:'numeric' });
      const normalizeDate = v => {
        if (!v) return null;
        const d = new Date(v);
        return Number.isNaN(d.getTime()) ? null : d;
      };

      function pFormat(article){
        if (!article) return '';
        // blank lines -> paragraphs ; single newlines -> <br>
        return String(article)
          .split(/\n\s*\n/)
          .map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`)
          .join('');
      }

      function openModal(idx){
        const row = NEWS[idx] || NEWS.find(n => n.id === idx);
        if (!row) return;
        const title = row.title || row.Title || 'Update';
        const rawDate = row.date || row.Date;
        const parsed = normalizeDate(rawDate);
        mTitle.textContent = title;
        mDate.textContent  = parsed ? dateFmt.format(parsed) : (rawDate || '');
        mBody.innerHTML    = pFormat(row.body || row.Article || '');
        modal.classList.add('show');
        modal.setAttribute('aria-hidden','false');
        document.body.style.overflow = 'hidden';
      }
      function closeModal(){
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden','true');
        document.body.style.overflow = '';
      }

      document.addEventListener('click', (e)=>{
        if (e.target.closest('[data-modal-close]')) { closeModal(); }
        if (e.target === modal) { closeModal(); } // backdrop click
        const open = e.target.closest('[data-news-open]');
        if (open) openModal(+open.getAttribute('data-news-open'));
      });
      document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeModal(); });

      function render(){
        if (!list) return;
        const enriched = NEWS.map((row, i) => ({ ...row, _idx: i }));
        const sorted = enriched.sort((a,b)=>{
          const aDate = normalizeDate(a.date || a.Date)?.getTime() || 0;
          const bDate = normalizeDate(b.date || b.Date)?.getTime() || 0;
          return (sort?.value || 'desc') === 'asc' ? aDate - bDate : bDate - aDate;
        });
        list.innerHTML = sorted.map(row => {
          const title = row.title || row.Title || 'Update';
          const rawDate = row.date || row.Date;
          const parsed = normalizeDate(rawDate);
          const pretty = parsed ? dateFmt.format(parsed) : (rawDate || '');
          return `
            <article class="card">
              <h3 style="margin-bottom:.25rem">${title}</h3>
              ${pretty ? `<div class="meta">${pretty}</div>` : ''}
              <div style="margin-top:.5rem">
                <a class="btn" href="javascript:void(0)" data-news-open="${row._idx}">Read more</a>
              </div>
            </article>`;
        }).join('');
      }

      async function loadNews(){
        try{
          const res  = await fetch('assets/data/news.json', {cache:'no-store'});
          const data = await res.json();
          NEWS = Array.isArray(data) ? data : (data.news || []);
          render();
        } catch (err){
          console.error(err);
          list.innerHTML = `<div class="card">Failed to load news.</div>`;
        }
      }

      loadNews();
      if (sort){
        sort.addEventListener('change', render);
      }
    })();
  </script>

  <!-- Load shared navbar (absolute path so it works everywhere) -->
  <script>
    fetch("/Iron-Crown-Combat/navbar.html")
      .then(r => r.text())
      .then(html => {
        const mount = document.getElementById("navbar");
        if (mount) mount.innerHTML = html;

        // Mobile menu toggle
        const btn = document.getElementById("menuBtn");
        const menu = document.getElementById("primaryMenu");
        if (btn && menu){
          btn.addEventListener("click", () => {
            const open = menu.classList.toggle("open");
            btn.setAttribute("aria-expanded", open ? "true" : "false");
          });
        }

        // Auto-highlight current page
        const path = location.pathname;
        document.querySelectorAll("#primaryMenu a.item").forEach(a => {
          try {
            const hrefPath = new URL(a.href, location.origin).pathname;
            if (hrefPath === path) a.classList.add("active");
          } catch(e){}
        });
      });
  </script>
</body>
</html>
