<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iron Crown Combat — News</title>
  <link rel="stylesheet" href="assets/css/main.css" />

  <!-- Modal styles kept inline so this page works by itself -->
  <style>
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; }
    .modal-backdrop.show { display: flex; }
    .modal { background: var(--bg-2); border: 1px solid var(--border); border-radius: 16px; max-width: min(800px, 92%); max-height: 85vh; overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
    .modal header { display:flex; justify-content:space-between; align-items:center; padding: .8rem 1rem; border-bottom:1px solid var(--border); }
    .modal .content { padding: 1rem; }
    .modal .meta { color: var(--muted); margin-bottom: .5rem; }
    .modal [data-modal-close] { cursor: pointer; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav" data-nav>
      <a class="logo" href="index.html" aria-label="Iron Crown Combat home">
        <img src="assets/img/favicon.png" alt="ICC" width="28" height="28" style="border-radius:6px;border:1px solid var(--border)" />
        <span>Iron Crown Combat</span>
      </a>
      <nav class="menu" aria-label="Primary">
        <a href="events.html">Events</a>
        <a href="rankings.html">Rankings</a>
        <a href="fighters.html">Fighters</a>
        <a href="gyms.html">Gyms</a>
        <a href="news.html" aria-current="page">News</a>
        <a href="rules.html">Rules</a>
        <a href="tournament.html">Tournaments</a>
        <a href="about.html">About</a>
      </nav>
      <div class="actions" style="display:flex;gap:.5rem;align-items:center">
        <button class="btn" data-theme-toggle title="Toggle theme" aria-label="Toggle light/dark theme">🌓</button>
        <button class="btn burger" data-drawer aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="pagehead"><h1>News</h1></div>

    <!-- List populated from Google Sheets (News tab) -->
    <section class="grid grid-2" id="news-list">
      <div class="card">Loading news…</div>
    </section>

    <!-- Accessible modal -->
    <div class="modal-backdrop" id="news-modal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="news-modal-title">
        <header>
          <h3 id="news-modal-title">Title</h3>
          <button class="btn" data-modal-close aria-label="Close">✕</button>
        </header>
        <div class="content">
          <div id="news-modal-date" class="meta"></div>
          <div id="news-modal-body" class="prose"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container cols">
      <small>© <span id="yr"></span> Iron Crown Combat · A TNGaming production</small>
      <div style="display:flex;gap:.6rem">
        <a class="chip" href="https://youtube.com/@SwtTNGaming" target="_blank" rel="noopener">YouTube</a>
        <a class="chip" href="https://www.twitch.tv/" target="_blank" rel="noopener">Twitch</a>
        <a class="chip" href="https://beacons.ai/tngamingyt" target="_blank" rel="noopener">Links</a>
      </div>
    </div>
  </footer>

  <script>
    // ---- minimal theme/nav helpers so the page is self-contained ----
    (function(){
      const root = document.documentElement;
      const saved = localStorage.getItem('icc:theme');
      if (saved === 'light') root.classList.add('light');
      document.addEventListener('click', (e)=>{
        const t = e.target.closest('[data-theme-toggle]');
        if (!t) return;
        root.classList.toggle('light');
        localStorage.setItem('icc:theme', root.classList.contains('light') ? 'light' : 'dark');
      });
    })();
    document.getElementById('yr').textContent = new Date().getFullYear();

    // ---- NEWS loader (uses your sheet & gid) ----
    (function(){
      const SHEET_ID = '1l8KRwK2D3Uyc6WTqqc6KO95nBqtfJ2WAnQSu6zyFicU';
      const GID_NEWS = '1273524900'; // News tab
      const csvUrl = gid => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;

      async function fetchCSV(){ 
        const res = await fetch(csvUrl(GID_NEWS), { cache:'no-store' }); 
        const text = await res.text(); 
        return parseCSV(text); 
      }
      function parseCSV(csv){
        const lines = csv.replace(/\r/g,'').split('\n').filter(Boolean);
        const rows = lines.map(line=>{
          const out=[]; let cur='', q=false;
          for (let i=0;i<line.length;i++){
            const c=line[i], n=line[i+1];
            if (c === '"' && n === '"'){ cur+='"'; i++; continue; }
            if (c === '"'){ q = !q; continue; }
            if (c === ',' && !q){ out.push(cur); cur=''; continue; }
            cur += c;
          }
          out.push(cur); return out;
        });
        const headers = rows[0].map(h=>h.trim());
        return rows.slice(1).map(r=>{ const o={}; headers.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o; });
      }

      // Modal helpers
      let NEWS_CACHE = [];
      const modal = document.getElementById('news-modal');
      const mTitle = document.getElementById('news-modal-title');
      const mDate  = document.getElementById('news-modal-date');
      const mBody  = document.getElementById('news-modal-body');

      function formatArticle(text){
        if (!text) return '';
        const parts = String(text).split(/\n\s*\n/);
        return parts.map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
      }
      function openModal(idx){
        const row = NEWS_CACHE[idx]; if (!row) return;
        mTitle.textContent = row['Title'] || 'Update';
        mDate.textContent  = row['Date']  || '';
        mBody.innerHTML    = formatArticle(row['Article'] || '');
        modal.classList.add('show');
        modal.setAttribute('aria-hidden','false');
        document.body.style.overflow = 'hidden';
      }
      function closeModal(){
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden','true');
        document.body.style.overflow = '';
      }
      document.addEventListener('click', (e)=>{
        if (e.target.closest('[data-modal-close]')) { closeModal(); }
        if (e.target === modal) { closeModal(); } // backdrop click
        const btn = e.target.closest('[data-news-idx]');
        if (btn) { openModal(Number(btn.getAttribute('data-news-idx'))); }
      });
      document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeModal(); });

      async function boot(){
        const list = document.getElementById('news-list');
        try {
          const rows = await fetchCSV();
          NEWS_CACHE = rows;
          list.innerHTML = rows.map((r,i)=>{
            const date  = r['Date']  || '';
            const title = r['Title'] || 'Update';
            return `
              <article class="card">
                <h3 style="margin-bottom:.2rem">
                  <button class="btn" style="padding:.35rem .7rem;border-radius:10px" data-news-idx="${i}" aria-haspopup="dialog">
                    ${title}
                  </button>
                </h3>
                ${date ? `<div class="meta">${date}</div>` : ''}
              </article>`;
          }).join('');
        } catch (err) {
          list.innerHTML = `<div class="card">Failed to load news.</div>`;
          console.error(err);
        }
      }
      boot();
    })();
  </script>
</body>
</html>
