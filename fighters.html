<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ICC Fighters</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #0e0e0e;
      color: #f1f1f1;
      font-family: 'Oswald','Impact',sans-serif;
      text-align: center;
      margin: 0;
    }
    .fighters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5em;
      padding: 2em;
      max-width: 1200px;
      margin: auto;
    }
    .fighter-card {
      position: relative;
      width: 250px;
      height: 250px;
      margin: auto;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 12px #0009;
      cursor: pointer;
    }
    .fighter-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .fighter-name {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.65);
      color: #ffd700;
      padding: 0.5em;
      font-weight: bold;
      font-size: 1.2em;
      text-align: center;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 1em;
    }
    .modal-content {
      background: #1a1a1a;
      max-width: 900px;
      width: 100%;
      border-radius: 12px;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      box-shadow: 0 6px 22px #000;
    }
    .modal-left {
      flex: 1;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1em;
      border-right: 3px solid #ffd700;
    }
    .modal-left img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .modal-right {
      flex: 1.2;
      padding: 1.5em;
      text-align: left;
      overflow-y: auto;
      max-height: 80vh;
    }
    .modal-right h2 {
      color: #ffd700;
      margin-top: 0;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      margin: 1em 0;
    }
    .stat-box {
      flex: 1 1 45%;
      background: #23272a;
      padding: 0.8em;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95em;
      word-break: break-word;
      text-align: center;
    }
    .bio {
      margin: 1em 0;
      font-size: 1em;
      line-height: 1.5;
      color: #ddd;
    }
    .awards {
      margin-top: 1.2em;
    }
    .awards strong {
      color: #ffd700;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 2em;
      color: #fff;
      cursor: pointer;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .modal-content {
        flex-direction: column;
      }
      .modal-left {
        border-right: none;
        border-bottom: 3px solid #ffd700;
        padding: 1em;
      }
      .modal-right {
        padding: 1em;
      }
      .stats {
        flex-direction: column;
      }
      .stat-box {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>
  <h1 style="color:#ffd700; margin:1em 0;">Iron Crown Combat Fighters</h1>
  <div class="fighters-grid" id="fightersGrid"></div>

  <!-- Modal -->
  <div class="modal" id="fighterModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="modal-left">
        <img id="modalImage" src="" alt="Fighter full">
      </div>
      <div class="modal-right">
        <h2 id="modalName"></h2>
        <div class="stats">
          <div class="stat-box" id="modalRecord"></div>
          <div class="stat-box" id="modalWin"></div>
          <div class="stat-box" id="modalGym"></div>
          <div class="stat-box" id="modalEarnings"></div>
        </div>
        <div class="bio" id="modalBio"></div>
        <div class="awards"><strong>Awards:</strong> <span id="modalAwards"></span></div>
      </div>
    </div>
  </div>

  <script>
    async function loadFighters() {
      const res = await fetch('fighters.json');
      const fighters = await res.json();
      const grid = document.getElementById('fightersGrid');

      fighters.forEach(f => {
        const card = document.createElement('div');
        card.className = 'fighter-card';
        card.innerHTML = `
          <img src="${f.headshot}" alt="${f.name}">
          <div class="fighter-name">${f.name}</div>
        `;
        card.onclick = () => openModal(f);
        grid.appendChild(card);
      });
    }

    function openModal(f) {
      document.getElementById('fighterModal').style.display = 'flex';
      document.getElementById('modalImage').src = f.image;
      document.getElementById('modalName').textContent = f.name;
      document.getElementById('modalRecord').textContent = `Record: ${f.record}`;
      document.getElementById('modalWin').textContent = `Win %: ${f.winPct}`;
      document.getElementById('modalGym').textContent = `Gym: ${f.gym}`;
      document.getElementById('modalEarnings').textContent = `Earnings: $${f.earnings}`;
      document.getElementById('modalBio').textContent = f.bio;
      document.getElementById('modalAwards').textContent = f.awards.length ? f.awards.join(', ') : 'No awards yet.';
    }

    function closeModal() {
      document.getElementById('fighterModal').style.display = 'none';
    }

    loadFighters();
  </script>
</body>
</html>
