<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iron Crown Combat — Fighters</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    /* Page sprinkles */
    .fighters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }
    .fighter-card {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg);
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .fighter-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
    }
    .fighter-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
      background: var(--bg-2);
    }
    .fighter-name-overlay {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: .45rem .6rem;
      background: linear-gradient(0deg, rgba(0,0,0,.7), rgba(0,0,0,0));
      color: #fff; font-weight: 700; letter-spacing: .02em;
      text-shadow: 0 2px 6px rgba(0,0,0,.5);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: none; align-items: center; justify-content: center; z-index: 50;
      padding: 1rem;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 16px; width: min(980px, 100%); max-height: 90vh; overflow: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .modal header {
      display:flex; justify-content:space-between; align-items:center;
      padding: .8rem 1rem; border-bottom:1px solid var(--border);
    }
    .modal .content {
      display: grid; grid-template-columns: 320px 1fr; gap: 1rem;
      padding: 1rem;
    }
    .modal .left-col .thumb {
      width: 100%; height: 260px; object-fit: cover; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg);
      display: block; margin-bottom: .75rem;
    }
    .stat {
      display:flex; justify-content: space-between; align-items:center;
      border: 1px solid var(--border); border-radius: 10px;
      padding: .5rem .7rem; margin-bottom: .5rem; background: var(--bg);
      font-weight: 600;
    }
    .awards { margin-top: .6rem; }
    .awards h4 { margin: 0 0 .4rem 0; }
    .badge {
      display:inline-flex; align-items:center; gap:.35rem;
      border:1px solid var(--border); padding:.2rem .5rem; border-radius: 999px;
      font-size: .85em; margin: 0 .3rem .3rem 0; background: var(--bg);
    }
    .right-col h3 { margin: .1rem 0 .4rem 0; font-size: 1.35rem; }
    .right-col .prose { white-space: pre-wrap; }

    @media (max-width: 860px){
      .modal .content { grid-template-columns: 1fr; }
      .modal .left-col .thumb { height: 220px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav" data-nav>
      <a class="logo" href="index.html" aria-label="Iron Crown Combat home">
        <img src="assets/img/favicon.png" alt="ICC" width="28" height="28" style="border-radius:6px;border:1px solid var(--border)" />
        <span>Iron Crown Combat</span>
      </a>
      <nav class="menu" aria-label="Primary">
        <a href="events.html">Events</a>
        <a href="rankings.html">Rankings</a>
        <a href="fighters.html" aria-current="page">Fighters</a>
        <a href="gyms.html">Gyms</a>
        <a href="news.html">News</a>
        <a href="rules.html">Rules</a>
        <a href="tournament.html">Tournaments</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="pagehead"><h1>Fighters</h1></div>

    <section class="fighters-grid" id="fightersGrid">
      <div class="card">Loading fighters…</div>
    </section>

    <!-- Modal -->
    <div class="modal-backdrop" id="fighterModal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="fighterModalTitle">
        <header>
          <h3 id="fighterModalTitle">Fighter</h3>
          <button class="btn" data-close aria-label="Close">✕</button>
        </header>
        <div class="content">
          <div class="left-col">
            <img id="modalImg" class="thumb" src="" alt="" />
            <div class="stat"><span>Record</span><span id="modalRecord">0-0-0</span></div>
            <div class="stat"><span>Total Earnings</span><span id="modalMoney">$0</span></div>
            <div class="awards">
              <h4>Awards</h4>
              <div id="modalAwards"></div>
            </div>
          </div>
          <div class="right-col">
            <h3 id="modalName">Fighter Name</h3>
            <div class="prose" id="modalBio">Bio</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container cols">
      <small>© <span id="yr"></span> Iron Crown Combat · A TNGaming production</small>
    </div>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    const FIGHTERS_URL = 'assets/fighters.json';

    const $ = s => document.querySelector(s);
    const grid = $('#fightersGrid');
    const modal = $('#fighterModal');
    const mTitle = $('#fighterModalTitle');
    const mName  = $('#modalName');
    const mImg   = $('#modalImg');
    const mRecord = $('#modalRecord');
    const mMoney = $('#modalMoney');
    const mAwards = $('#modalAwards');
    const mBio   = $('#modalBio');

    function formatMoney(n){
      const num = (typeof n === 'string') ? Number(n.replace(/[^0-9.-]/g,'')) : Number(n||0);
      return num.toLocaleString(undefined, { style:'currency', currency:'USD', maximumFractionDigits:0 });
    }
    function recordStr(w=0,l=0,d=0){
      const wi = parseInt(w||0,10), lo=parseInt(l||0,10), dr=parseInt(d||0,10);
      return `${wi}-${lo}-${dr}`;
    }
    function safe(val, fallback=''){
      return (val === null || val === undefined) ? fallback : String(val);
    }

    // Normalize fighters.json => array of objects { name, img, wins, losses, draws, earnings, bio, awards[] }
    function normalize(data){
      // supports either { fighters: {...} } or flat { ... }
      const raw = data && data.fighters ? data.fighters : data;
      const out = [];

      if (Array.isArray(raw)) {
        raw.forEach(f => {
          if (!f) return;
          const name = f.name || f.Fighter || f.id || 'Unknown';
          out.push({
            name,
            img: f.img || f.Image || '',
            wins: f.wins ?? f.Wins ?? 0,
            losses: f.losses ?? f.Losses ?? 0,
            draws: f.draws ?? f.Draws ?? 0,
            earnings: f.earnings ?? f.Earnings ?? 0,
            bio: f.bio ?? f.Bio ?? '',
            awards: f.awards || f.Awards || []
          });
        });
      } else if (raw && typeof raw === 'object') {
        Object.entries(raw).forEach(([key, f])=>{
          if (!f || typeof f !== 'object') return;
          const name = f.name || f.Fighter || key;
          out.push({
            name,
            img: f.img || f.Image || '',
            wins: f.wins ?? f.Wins ?? 0,
            losses: f.losses ?? f.Losses ?? 0,
            draws: f.draws ?? f.Draws ?? 0,
            earnings: f.earnings ?? f.Earnings ?? 0,
            bio: f.bio ?? f.Bio ?? '',
            awards: f.awards || f.Awards || []
          });
        });
      }

      // Sort A→Z by name
      out.sort((a,b)=> String(a.name).localeCompare(String(b.name)));
      return out;
    }

    function cardHTML(f, idx){
      // If missing image, still render card (with neutral bg)
      const imgAttr = f.img ? `src="${f.img}"` : '';
      return `
        <article class="fighter-card" data-idx="${idx}" title="View ${safe(f.name)}">
          <img ${imgAttr} alt="${safe(f.name)}" onerror="this.removeAttribute('src')" />
          <div class="fighter-name-overlay">${safe(f.name)}</div>
        </article>
      `;
    }

    function awardsHTML(awards){
      const list = Array.isArray(awards) ? awards : [];
      if (!list.length) return '<span class="meta">No awards yet.</span>';
      return list.map(a => `<span class="badge">🏅 ${safe(a)}</span>`).join('');
    }

    function openModal(f){
      mTitle.textContent = safe(f.name);
      mName.textContent  = safe(f.name);
      mImg.src = f.img || '';
      mImg.alt = f.name || 'Fighter';
      mRecord.textContent = recordStr(f.wins, f.losses, f.draws);
      mMoney.textContent = formatMoney(f.earnings);
      mAwards.innerHTML = awardsHTML(f.awards);
      mBio.textContent = safe(f.bio) || '—';
      modal.classList.add('show');
      modal.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
    }
    function closeModal(){
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
    }

    // Close handlers
    document.addEventListener('click', (e)=>{
      if (e.target.matches('[data-close]')) closeModal();
      if (e.target === modal) closeModal();
      const card = e.target.closest('.fighter-card');
      if (card) {
        const i = Number(card.getAttribute('data-idx'));
        if (!isNaN(i) && window.__Fighters && window.__Fighters[i]) {
          openModal(window.__Fighters[i]);
        }
      }
    });
    document.addEventListener('keydown', (e)=>{
      if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
    });

    async function fetchJSON(url){
      const r = await fetch(url, { cache:'no-store' });
      if (!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }

    async function boot(){
      try {
        const data = await fetchJSON(FIGHTERS_URL);
        const fighters = normalize(data);
        window.__Fighters = fighters;

        if (!fighters.length) {
          grid.innerHTML = '<div class="card">No fighters found in assets/fighters.json.</div>';
          return;
        }

        grid.innerHTML = fighters.map((f, i)=>cardHTML(f, i)).join('');
      } catch (e){
        console.error(e);
        grid.innerHTML = '<div class="card">Failed to load fighters.</div>';
      }
    }

    boot();
  </script>
</body>
</html>
