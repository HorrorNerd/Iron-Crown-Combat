<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iron Crown Combat — Fighters</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    /* Grid of fighter images with name overlay */
    .fighters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }
    .fighter-card {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg);
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .fighter-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(0,0,0,.25);
    }
    .fighter-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
      background: var(--bg-2);
    }
    .fighter-name-overlay {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: .5rem .6rem;
      background: linear-gradient(0deg, rgba(0,0,0,.75), rgba(0,0,0,0));
      color: #fff; font-weight: 700; letter-spacing: .02em;
      text-shadow: 0 2px 6px rgba(0,0,0,.6);
    }

  /* Modal layout */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  display: none; align-items: center; justify-content: center; z-index: 50;
  padding: 1rem;
}
.modal-backdrop.show { display: flex; }

/* Make modal a flex column so header stays fixed and body scrolls */
.modal {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 16px; width: min(980px, 100%);
  max-height: 90vh; display: flex; flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

/* Header stays at top, content scrolls */
.modal header {
  flex: 0 0 auto;
  display:flex; justify-content:space-between; align-items:center;
  padding: .8rem 1rem; border-bottom:1px solid var(--border);
}
.modal .content {
  flex: 1 1 auto;
  overflow: auto;
  display: grid; grid-template-columns: 320px 1fr; gap: 1rem;
  padding: 1rem;
}

/* Left column image + stats */
.left-col .thumb-wrap {
  width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; overflow:hidden;
  border: 1px solid var(--border); background: var(--bg);
  margin-bottom: .75rem;
}
.left-col .thumb {
  width:100%; height:100%; object-fit: cover; display:block;
}

.stat {
  display:flex; justify-content: space-between; align-items:center;
  border: 1px solid var(--border); border-radius: 10px;
  padding: .55rem .7rem; margin-bottom: .5rem; background: var(--bg);
  font-weight: 600;
}
.awards { margin-top: .6rem; }
.awards h4 { margin: 0 0 .4rem 0; }
.badge {
  display:inline-flex; align-items:center; gap:.35rem;
  border:1px solid var(--border); padding:.2rem .5rem; border-radius: 999px;
  font-size: .85em; margin: 0 .3rem .3rem 0; background: var(--bg);
}

.right-col h3 { margin: .1rem 0 .5rem 0; font-size: 1.35rem; }
.right-col .prose { white-space: pre-wrap; line-height: 1.5; }

/* Mobile: stack columns and keep content scrollable */
@media (max-width: 860px){
  .modal { width: 100%; max-height: 100vh; border-radius: 12px; }
  .modal .content { grid-template-columns: 1fr; }
  .left-col .thumb-wrap { aspect-ratio: 4/3; }
}


    @media (max-width: 860px){
      .modal .content { grid-template-columns: 1fr; }
      .left-col .thumb-wrap { aspect-ratio: 4/3; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav" data-nav>
      <a class="logo" href="index.html" aria-label="Iron Crown Combat home">
        <img src="assets/img/favicon.png" alt="ICC" width="28" height="28" style="border-radius:6px;border:1px solid var(--border)" />
        <span>Iron Crown Combat</span>
      </a>
      <nav class="menu" aria-label="Primary">
        <a href="events.html">Events</a>
        <a href="rankings.html">Rankings</a>
        <a href="fighters.html" aria-current="page">Fighters</a>
        <a href="gyms.html">Gyms</a>
        <a href="news.html">News</a>
        <a href="rules.html">Rules</a>
        <a href="tournament.html">Tournaments</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="pagehead"><h1>Fighters</h1></div>

    <section class="fighters-grid" id="fightersGrid">
      <div class="card">Loading fighters…</div>
    </section>

    <!-- Modal -->
    <div class="modal-backdrop" id="fighterModal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="fighterModalTitle">
        <header>
          <h3 id="fighterModalTitle">Fighter</h3>
          <button class="btn" data-close aria-label="Close">✕</button>
        </header>
        <div class="content">
          <div class="left-col">
            <div class="thumb-wrap"><img id="modalImg" class="thumb" src="" alt="" /></div>
            <div class="stat"><span>Record</span><span id="modalRecord">0-0-0</span></div>
            <div class="stat"><span>Total Earnings</span><span id="modalMoney">$0</span></div>
            <div class="awards">
              <h4>Awards</h4>
              <div id="modalAwards" class="meta">No awards yet.</div>
            </div>
          </div>
          <div class="right-col">
            <h3 id="modalName">Fighter Name</h3>
            <div class="prose" id="modalBio">Bio</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container cols">
      <small>© <span id="yr"></span> Iron Crown Combat · A TNGaming production</small>
    </div>
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    // ---- Google Sheets setup (provided by you) ----
    const SHEET_ID = '1l8KRwK2D3Uyc6WTqqc6KO95nBqtfJ2WAnQSu6zyFicU';
    const GID_FIGHTERS = '1277877160';   // Fighter Tracker
    const GID_RESULTS  = '676906080';    // Event Results (for bonus/awards)
    const csvUrl = gid => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;

    // ---- DOM shorthands ----
    const $ = s => document.querySelector(s);
    const grid = $('#fightersGrid');
    const modal = $('#fighterModal');
    const mTitle = $('#fighterModalTitle');
    const mName  = $('#modalName');
    const mImg   = $('#modalImg');
    const mRecord = $('#modalRecord');
    const mMoney = $('#modalMoney');
    const mAwards = $('#modalAwards');
    const mBio   = $('#modalBio');

    // ---- Utils ----
    function slugify(s){
      return String(s||'').toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    }
    function safe(val, fallback=''){ return (val === null || val === undefined) ? fallback : String(val); }
    function formatMoney(n){
      const num = (typeof n === 'string') ? Number(n.replace(/[^0-9.-]/g,'')) : Number(n||0);
      return num.toLocaleString(undefined, { style:'currency', currency:'USD', maximumFractionDigits:0 });
    }
    function recordStr(w=0,l=0,d=0){
      const wi = parseInt(w||0,10), lo=parseInt(l||0,10), dr=parseInt(d||0,10);
      return `${isFinite(wi)?wi:0}-${isFinite(lo)?lo:0}-${isFinite(dr)?dr:0}`;
    }

    // Robust CSV parser (supports quoted fields with commas/newlines)
    function parseCSV(csv){
      const rows=[]; let i=0, field='', row=[], q=false;
      const pushField=()=>{ row.push(field); field=''; };
      const pushRow=()=>{ rows.push(row); row=[]; };
      while(i<csv.length){
        const c = csv[i];
        if (q){
          if (c === '"'){
            if (csv[i+1] === '"'){ field+='"'; i++; }
            else { q = false; }
          } else {
            field += c;
          }
        } else {
          if (c === '"'){ q = true; }
          else if (c === ','){ pushField(); }
          else if (c === '\n'){ pushField(); pushRow(); }
          else if (c === '\r'){ /* skip */ }
          else { field += c; }
        }
        i++;
      }
      // last field
      if (field!=='' || row.length){ pushField(); pushRow(); }
      if (!rows.length) return [];
      const headers = rows[0].map(h=>h.trim());
      return rows.slice(1).filter(r=>r.some(x=>String(x).trim()!=='')).map(r=>{
        const o={}; headers.forEach((h,k)=>o[h]=(r[k]||'').trim()); return o;
      });
    }

    async function fetchCSV(gid){
      const res = await fetch(csvUrl(gid), { cache:'no-store' });
      if (!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      return parseCSV(text);
    }

    // Build awards map from Event Results (bonus type assigned to Winner)
    async function buildAwards(){
      const rows = await fetchCSV(GID_RESULTS);
      const map = Object.create(null);
      for (const r of rows){
        const winner = (r['Winner']||'').trim();
        const bonus  = (r['bonus type']||r['Bonus']||'').trim();
        if (!winner || !bonus) continue;
        map[winner] = map[winner] || [];
        map[winner].push(bonus);
      }
      // compact to unique
      Object.keys(map).forEach(k=>{
        map[k] = Array.from(new Set(map[k]));
      });
      return map;
    }

    function fighterCardHTML(f, idx){
      const imgAttr = f._thumb ? `src="${f._thumb}"` : '';
      return `
        <article class="fighter-card" data-idx="${idx}" title="View ${safe(f.Fighter)}">
          <img ${imgAttr} alt="${safe(f.Fighter)}" onerror="this.removeAttribute('src')" />
          <div class="fighter-name-overlay">${safe(f.Fighter)}</div>
        </article>
      `;
    }

    function awardsHTML(list){
      const a = Array.isArray(list) ? list : [];
      if (!a.length) return '<span class="meta">No awards yet.</span>';
      return a.map(x => `<span class="badge">🏅 ${safe(x)}</span>`).join('');
    }

    function openModal(f){
      mTitle.textContent = safe(f.Fighter);
      mName.textContent  = safe(f.Fighter);
      mImg.src = f._headshot || f._thumb || '';
      mImg.alt = f.Fighter || 'Fighter';
      mRecord.textContent = recordStr(f.Wins, f.Losses, f.Draws);
      mMoney.textContent = formatMoney(f.Earnings);
      mAwards.innerHTML = awardsHTML(f._awards);
      mBio.textContent = safe(f.Bio) || '—';
      modal.classList.add('show');
      modal.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
    }
    function closeModal(){
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
    }

    document.addEventListener('click', (e)=>{
      if (e.target.matches('[data-close]')) closeModal();
      if (e.target === modal) closeModal();
      const card = e.target.closest('.fighter-card');
      if (card && window.__Fighters) {
        const i = Number(card.getAttribute('data-idx'));
        if (!isNaN(i) && window.__Fighters[i]) openModal(window.__Fighters[i]);
      }
    });
    document.addEventListener('keydown', (e)=>{
      if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
    });

    // Choose best image:
    // 1) Image column (absolute or relative URL)
    // 2) assets/images/fighters/<slug>.png (your uploaded headshots)
    function chooseImagesFor(f){
  const name = f.Fighter || '';
  const fromSheet = (f.Image || '').trim();  // optional sheet URL
  const slug = slugify(name);

  // Your folders:
  // - Grid card uses: assets/images/fighters/<slug>.png
  // - Modal headshot uses: assets/images/fighters/headshots/<slug>.png
  const localGrid = `assets/images/fighters/${slug}.png`;
  const localHead = `assets/images/fighters/headshots/${slug}.png`;

  // Thumbnail for the grid: prefer local card image
  f._thumb = localGrid || fromSheet || '';

  // Headshot in modal: prefer local headshot, then sheet, then grid image
  f._headshot = localHead || fromSheet || localGrid || '';
}


    async function boot(){
      try {
        // Load awards first
        const awardsMap = await buildAwards();

        // Load Fighter Tracker
        const rows = await fetchCSV(GID_FIGHTERS);
        // Expected columns:
        // Fighter, Wins, Losses, Draws, Total Fights, Gender, Earnings, Bio, Image, Gym, Win %
        const fighters = rows.filter(r => (r['Fighter']||'').trim() !== '');
        // attach derived fields
        for (const f of fighters){
          chooseImagesFor(f);
          f._awards = awardsMap[f.Fighter] || [];
        }
        // sort A→Z by Fighter
        fighters.sort((a,b)=> String(a.Fighter).localeCompare(String(b.Fighter)));

        window.__Fighters = fighters;

        if (!fighters.length){
          grid.innerHTML = '<div class="card">No fighters found in the spreadsheet.</div>';
          return;
        }

        grid.innerHTML = fighters.map((f,i)=>fighterCardHTML(f,i)).join('');
      } catch (e){
        console.error(e);
        grid.innerHTML = `
          <div class="card">
            <strong>Failed to load fighters from Google Sheets.</strong><br>
            ${e.message || e.toString()}
          </div>`;
      }
    }

    boot();
  </script>
</body>
</html>
