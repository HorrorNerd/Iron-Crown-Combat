<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="no-referrer">
  <title>Iron Crown Combat - Fighters</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .fighter-card {
      border:2px solid #332;
      padding:1em;
      margin:1em;
      background:#181a1b;
      border-radius:10px;
      max-width:240px;
      text-align:center;
      color:#ffd700;
      display:inline-block;
      vertical-align:top;
      box-sizing:border-box;
    }
    .fighter-photo {
      width:100px; height:100px;
      border-radius:50%;
      object-fit:cover;
      margin-bottom:8px;
      border:2px solid #444;
      background: #222;
      display:block;
      margin:8px auto;
    }
    .fighter-name {
      font-size:1.13em;
      font-weight:bold;
      color:#fff;
      margin-bottom:4px;
    }
    .fighter-earnings {
      font-size:1em;
      color:#ffd700;
      margin-top:6px;
      font-weight:600;
    }
    .view-bio-btn {
      background:#ffd700;
      color:#181a1b;
      border-radius:5px;
      border:none;
      padding:6px 16px;
      cursor:pointer;
      margin-top:7px;
      font-weight:bold;
      transition:background 0.2s;
    }
    .view-bio-btn:hover { background:#e56915; }
    #modal {
      position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7); display: none; justify-content:center; align-items:center; z-index:1001;
    }
    #modal-content {
      background: #181a1b; color: #ffd700; border-radius:12px; padding:2em; min-width: 260px; max-width: 98vw;
      text-align: center; position: relative;
    }
    #close-modal-btn {
      position: absolute; top: 14px; right: 18px; background:none; border:none; color: #ffd700;
      font-size: 1.5em; cursor:pointer;
    }
    .fighter-modal-details {
      color:#eee; font-size:1em; margin:10px 0 1px;
    }
    .awards-list {
      background: #222;
      color: #ffd700;
      margin: 7px auto 10px;
      padding: 8px;
      border-radius: 6px;
      max-width: 90%;
      font-size:0.97em;
      text-align:left;
      display:inline-block;
    }
    .roster-grid { text-align:center; }
  </style>
</head>
<body>
  <header class="header">
    <h1 class="logo">
      <span class="iron">IRON </span><span class="crown">CROWN</span> <span class="combat">COMBAT</span>
    </h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="fighters.html" class="active">Fighters</a>
      <a href="events.html">Events</a>
      <a href="rankings.html">Rankings</a>
      <a href="news.html">News</a>
      <a href="tournament.html">Tournament</a>
      <a href="about.html">About</a>
      <a href="rules.html">Test Your Metal</a>
      <a href="guestbook.html">Guestbook</a>
    </nav>
  </header>

  <main>
    <h2 style="text-align:center;color:#ffd700;">Fighter Roster</h2>
    <div class="roster-grid" id="fighters-container">
      <p style="text-align:center; font-size:1.2em; color:#ffd700;">Loading fighter roster...</p>
    </div>
  </main>

  <div id="modal">
    <div id="modal-content"></div>
  </div>

  <footer class="footer">
    &copy; 2025 Iron Crown Combat. All rights reserved.
  </footer>

  <script>
    const SHEET_ID = "1l8KRwK2D3Uyc6WTqqc6KO95nBqtfJ2WAnQSu6zyFicU";
    const TRACKER_URL = `https://opensheet.elk.sh/${SHEET_ID}/Fighter Tracker`;
    const EVENT_RESULTS_URL = `https://opensheet.elk.sh/${SHEET_ID}/Event Results`;

    let fighterAwards = {};

    // First, fetch awards (bonuses) for each fighter from Event Results tab:
    fetch(EVENT_RESULTS_URL)
      .then(res => res.json())
      .then(resultRows => {
        fighterAwards = {};
        resultRows.forEach(row => {
          const fName = row["Fighter"]?.trim();
          const bonusType = row["Bonus Type"]?.trim();
          if (fName && bonusType) {
            if (!fighterAwards[fName]) fighterAwards[fName] = [];
            fighterAwards[fName].push(bonusType);
          }
        });

        // Now fetch Fighter Tracker data and render fighters
        fetch(TRACKER_URL)
          .then(res => res.json())
          .then(rows => {
            const container = document.getElementById('fighters-container');
            container.innerHTML = "";

            rows.forEach(row => {
              // If your sheet uses different column names, update them here:
              const name = row.Fighter || "Unknown";
              const earnings = row.Earnings || "$0";
              const image = row.Image || "";
              const bio = row.Bio || "";
              const record = row.Record || "";
              const stats = row.Stats || "";

              const fighterDiv = document.createElement('div');
              fighterDiv.className = "fighter-card";
              fighterDiv.innerHTML = `
                <img src="${image}" alt="${name}" class="fighter-photo" />
                <div class="fighter-name">${name}</div>
                <div class="fighter-earnings">Earnings: <span>${earnings}</span></div>
                <button class="view-bio-btn" onclick="showModal(
                  '${escapeHTML(name)}',
                  '${escapeHTML(bio)}',
                  '${image}',
                  '${escapeHTML(record)}',
                  '${escapeHTML(stats)}',
                  '${escapeHTML(earnings)}'
                )">View Details</button>
              `;
              container.appendChild(fighterDiv);
            });

            // Modal logic, hooks up all details and live awards
            window.showModal = (name, bio, image, record, stats, earnings) => {
              const overlay = document.getElementById('modal');
              const content = document.getElementById('modal-content');
              let awardsHtml = '';
              const awards = fighterAwards[name] || [];
              if (awards.length) {
                awardsHtml = `<div style="font-weight:bold;margin-bottom:5px;">Awards / Bonuses:</div>
                  <div class="awards-list">${awards.map(a => `<div>• ${a}</div>`).join('')}</div>`;
              }
              content.innerHTML = `
                <button id="close-modal-btn" onclick="hideModal()">&#x2715;</button>
                <img src="${image}" alt="${name}" style="width:86px;height:86px;border-radius:60px;object-fit:cover;border:2px solid #444;background:#222;margin-bottom:12px;">
                <div style="font-weight:bold;font-size:1.2em;color:#ffd700; margin-bottom:7px;">${name}</div>
                <div class="fighter-modal-details"><span style="color:#ffd700;">Record:</span> ${record}</div>
                <div class="fighter-modal-details"><span style="color:#ffd700;">Earnings:</span> ${earnings}</div>
                <div class="fighter-modal-details"><span style="color:#ffd700;">Stats:</span> ${stats}</div>
                ${awardsHtml}
                <div style="margin:10px 0 7px;color:#ccc;">${bio ? bio : "No biography available."}</div>
              `;
              overlay.style.display = "flex";
            };
            window.hideModal = () => {
              document.getElementById('modal').style.display = "none";
            };
            document.addEventListener('keydown', function(e){
              if(e.key==='Escape'){hideModal();}
            });
            document.getElementById('modal').addEventListener('click', function(e){
              if(e.target === this){hideModal();}
            });
          });
      });

    function escapeHTML(txt) {
      return String(txt||"").replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
                            .replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
